<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Galería | Manuel Jiménez</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Tipografía -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    header {
      padding: 30px 40px;
    }

    header a {
      color: #888;
      text-decoration: none;
      font-size: 13px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 32px;
      margin: 0 40px 80px 40px;
    }

    .gallery {
      max-width: 1200px;
      margin: auto;
      padding: 0 20px 100px 20px;
    }

    .item {
      margin-bottom: 120px;
      cursor: pointer;
      position: relative;
    }

    .item img {
      width: 100%;
      display: block;
      filter: blur(20px);
      transform: scale(1.02);
      transition: filter 0.8s ease, transform 0.8s ease;
    }

    .item img.loaded {
      filter: blur(0);
      transform: scale(1);
    }

    /* Texto minimal */
    .caption {
      margin-top: 12px;
      font-size: 12px;
      color: #aaa;
      letter-spacing: 1px;
    }

    /* Tamaños */
    .large { max-width: 1100px; margin: auto; }
    .medium { max-width: 800px; margin: auto; }

    /* FULL BLEED */
    .full {
      width: 100vw;
      margin-left: calc(-50vw + 50%);
    }

    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.97);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .lightbox.active {
      display: flex;
      opacity: 1;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 85%;
      transition: opacity 0.4s ease;
    }

    .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 40px;
      cursor: pointer;
      padding: 20px;
    }

    .prev { left: 20px; }
    .next { right: 20px; }

    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 30px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      h1 {
        margin: 0 20px 40px 20px;
        font-size: 24px;
      }

      .item {
        margin-bottom: 60px;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="index.html">← Volver</a>
</header>

<h1>Galería</h1>

<div class="gallery">

  <div class="item large">
    <img src="photos/osprey.jpg">
    <div class="caption">Osprey · México</div>
  </div>

  <div class="item medium">
    <img src="photos/teco1.jpg">
    <div class="caption">Tecolote · Bosque</div>
  </div>

  <div class="item full">
    <img src="photos/colibri.jpg">
    <div class="caption">Colibrí · Selva</div>
  </div>

  <div class="item medium">
    <img src="photos/teco2.jpg">
    <div class="caption">Tecolote · Nocturno</div>
  </div>

  <div class="item large">
    <img src="photos/trogon.jpg">
    <div class="caption">Trogón · Niebla</div>
  </div>

</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <span class="close" onclick="closeLightbox()">✕</span>
  <span class="nav prev" onclick="prevImage()">‹</span>
  <img id="lightbox-img">
  <span class="nav next" onclick="nextImage()">›</span>
</div>

<script>
  const images = document.querySelectorAll('.item img');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');

  let currentIndex = 0;

  // Blur loading
  images.forEach(img => {
    const temp = new Image();
    temp.src = img.src;
    temp.onload = () => {
      img.classList.add('loaded');
    };
  });

  // Click open
  images.forEach((img, index) => {
    img.addEventListener('click', () => {
      currentIndex = index;
      showImage();
    });
  });

  function showImage() {
    lightboxImg.style.opacity = 0;
    setTimeout(() => {
      lightboxImg.src = images[currentIndex].src;
      lightboxImg.style.opacity = 1;
    }, 150);
    lightbox.classList.add('active');
  }

  function closeLightbox() {
    lightbox.classList.remove('active');
  }

  function nextImage() {
    currentIndex = (currentIndex + 1) % images.length;
    showImage();
  }

  function prevImage() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    showImage();
  }

  // Keyboard
  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('active')) return;

    if (e.key === 'ArrowRight') nextImage();
    if (e.key === 'ArrowLeft') prevImage();
    if (e.key === 'Escape') closeLightbox();
  });

  // SWIPE MOBILE
  let startX = 0;

  lightbox.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
  });

  lightbox.addEventListener('touchend', e => {
    let endX = e.changedTouches[0].clientX;

    if (startX - endX > 50) nextImage();
    if (endX - startX > 50) prevImage();
  });

</script>

</body>
</html>
