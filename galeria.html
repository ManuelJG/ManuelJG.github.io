<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Galería | Manuel Jiménez</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="favicon.png">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    header {
      padding: 30px 40px;
    }

    header a {
      color: #ccc;
      text-decoration: none;
      font-size: 13px;
    }

    header a:hover {
      color: white;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 32px;
      margin: 0 40px 30px 40px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 0 40px 40px 40px;
    }

    .gallery-item {
      position: relative;
      aspect-ratio: 3 / 2;
      overflow: hidden;
    }

    .gallery-item img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
      transition: 0.3s;
    }

    .gallery-item img:hover {
      opacity: 0.85;
    }

    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90%;
    }

    .lightbox.active {
      display: flex;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .gallery {
        grid-template-columns: 1fr;
        padding: 0 20px 20px 20px;
      }

      h1 {
        font-size: 24px;
        margin: 0 20px 20px 20px;
      }

      header {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html">← Volver</a>
  </header>

  <h1>Galería</h1>

  <div class="gallery">
    <div class="gallery-item"><img src="ospreyMJG-mobile.jpg" onclick="openLightbox(this.src)"></div>
    <div class="gallery-item"><img src="photos/teco1.jpg" onclick="openLightbox(this.src)"></div>
    <div class="gallery-item"><img src="photos/colibri.jpg" onclick="openLightbox(this.src)"></div>
    <div class="gallery-item"><img src="photos/teco2.jpg" onclick="openLightbox(this.src)"></div>
    <div class="gallery-item"><img src="photos/guacas.jpg" onclick="openLightbox(this.src)"></div>
    <div class="gallery-item"><img src="photos/flamingo.jpg" onclick="openLightbox(this.src)"></div>
    <div class="gallery-item"><img src="photos/deer.jpg" onclick="openLightbox(this.src)"></div>
    <div class="gallery-item"><img src="photos/gcent.jpg" onclick="openLightbox(this.src)"></div>
    <div class="gallery-item"><img src="photos/trogon.jpg" onclick="openLightbox(this.src)"></div>
  </div>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img">
  </div>

  <script>
    function openLightbox(src) {
      const lightbox = document.getElementById('lightbox');
      const img = document.getElementById('lightbox-img');
      img.src = src;
      lightbox.classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }
  </script>

</body>
</html>
