<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Galería | Manuel Jiménez</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Tipografías -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    /* Header */
    header {
      padding: 30px 40px;
    }

    header a {
      color: #ccc;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    header a:hover {
      color: white;
    }

    /* Título */
    h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 32px;
      margin: 0 40px 30px 40px;
    }

    /* Galería */
    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 0 40px 40px 40px;
    }

    /* Contenedor con ratio fijo */
    .gallery-item {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 2;
      overflow: hidden;
    }

    .gallery-item img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: 0.4s;
      cursor: pointer;
    }

    .gallery-item img:hover {
      opacity: 0.85;
    }

    /* Mobile */
    @media (max-width: 600px) {
      header {
        padding: 20px;
      }

      h1 {
        font-size: 24px;
        margin: 0 20px 20px 20px;
      }

      .gallery {
        grid-template-columns: 1fr;
        padding: 0 20px 20px 20px;
      }
    }
  </style>
</head>

<body>

  <!-- Navegación -->
  <header>
    <a href="index.html">← Volver</a>
  </header>

  <!-- Título -->
  <h1>Galería</h1>

  <!-- Galería -->
  <div class="gallery">
    <div class="gallery-item"><img src="ospreyMJG-mobile.jpg" alt=""></div>
    <div class="gallery-item"><img src="foto2.jpg" alt=""></div>
    <div class="gallery-item"><img src="foto3.jpg" alt=""></div>
    <div class="gallery-item"><img src="foto4.jpg" alt=""></div>
    <div class="gallery-item"><img src="foto5.jpg" alt=""></div>
    <div class="gallery-item"><img src="foto6.jpg" alt=""></div>
  </div>

</body>
</html>
