<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Galería | Manuel Jiménez</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="favicon.png">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* HEADER */

    header {
      padding: 30px 40px;
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header a {
      color: #888;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 1px;
      transition: color 0.3s ease;
    }

    header a:hover {
      color: white;
    }

    /* LANGUAGE TOGGLE */

    .lang-toggle {
      font-size: 12px;
      letter-spacing: 1px;
    }

    .lang-toggle span {
      margin-left: 10px;
      cursor: pointer;
      color: #777;
      transition: color 0.3s ease;
    }

    .lang-toggle span:hover {
      color: white;
    }

    .lang-toggle .active {
      color: white;
    }

    /* TITLE */

    h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 32px;
      margin: 0 40px 35px 40px;
    }

    /* MAIN */

    .viewer {
      width: 100%;
      padding: 0 40px;
    }

    /* MAIN IMAGE AREA */

    .image-stage {
      position: relative;
      width: 100%;
      height: 68vh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .main-image {
      max-width: 88%;
      max-height: 100%;
      width: auto;
      height: auto;

      object-fit: contain;

      opacity: 0;

      transition:
        opacity 0.45s ease,
        transform 0.45s ease;
    }

    .main-image.visible {
      opacity: 1;
    }

    /* NAVIGATION ARROWS */

    .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);

      width: 60px;
      height: 100px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 32px;
      font-weight: 300;

      color: #777;
      cursor: pointer;

      user-select: none;

      transition:
        color 0.3s ease,
        opacity 0.3s ease;
    }

    .nav:hover {
      color: white;
    }

    .prev {
      left: 0;
    }

    .next {
      right: 0;
    }

    /* CAPTION */

    .caption-area {
      text-align: center;
      margin-top: 18px;
      min-height: 42px;
    }

    .caption-title {
      font-family: 'Playfair Display', serif;
      font-size: 17px;
      font-weight: 400;
      color: #ddd;
      margin-bottom: 5px;
    }

    .caption-location {
      font-size: 11px;
      letter-spacing: 1px;
      color: #777;
      text-transform: uppercase;
    }

    /* COUNTER */

    .counter {
      text-align: center;
      margin-top: 12px;

      font-size: 10px;
      letter-spacing: 2px;
      color: #555;
    }

    /* THUMBNAILS */

    .thumbnails-wrapper {
      width: 100%;
      margin-top: 28px;
      overflow-x: auto;
      overflow-y: hidden;

      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }

    .thumbnails {
      display: flex;
      justify-content: center;
      gap: 8px;

      min-width: max-content;
      padding: 4px 0 15px 0;
    }

    .thumbnail {
      position: relative;

      width: 82px;
      height: 55px;

      flex: 0 0 auto;

      overflow: hidden;

      cursor: pointer;

      opacity: 0.45;

      transition:
        opacity 0.3s ease,
        transform 0.3s ease;
    }

    .thumbnail:hover {
      opacity: 0.8;
    }

    .thumbnail.active {
      opacity: 1;
    }

    .thumbnail.active::after {
      content: "";

      position: absolute;
      bottom: 0;
      left: 0;

      width: 100%;
      height: 2px;

      background: white;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      header {
        padding: 20px;
      }

      h1 {
        font-size: 24px;
        margin: 0 20px 25px 20px;
      }

      .viewer {
        padding: 0 15px;
      }

      .image-stage {
        height: 58vh;
      }

      .main-image {
        max-width: 94%;
      }

      .nav {
        width: 40px;
        height: 80px;
        font-size: 26px;
      }

      .prev {
        left: -5px;
      }

      .next {
        right: -5px;
      }

      .caption-title {
        font-size: 15px;
      }

      .caption-location {
        font-size: 10px;
      }

      .thumbnails-wrapper {
        margin-top: 22px;
      }

      .thumbnails {
        justify-content: flex-start;
      }

      .thumbnail {
        width: 70px;
        height: 47px;
      }
    }

  </style>
</head>

<body>

  <!-- HEADER -->

  <header>

    <a href="index.html"
       data-es="← Volver"
       data-en="← Back">
       ← Volver
    </a>

    <div class="lang-toggle">
      <span onclick="setLang('es')">ES</span>
      <span onclick="setLang('en')">EN</span>
    </div>

  </header>


  <h1
    data-es="Galería"
    data-en="Gallery">
    Galería
  </h1>


  <!-- VIEWER -->

  <div class="viewer">

    <div class="image-stage">

      <div class="nav prev" onclick="prevImage()">‹</div>

      <img
        id="mainImage"
        class="main-image"
        src=""
        alt="">

      <div class="nav next" onclick="nextImage()">›</div>

    </div>


    <!-- CAPTION -->

    <div class="caption-area">

      <div
        id="captionTitle"
        class="caption-title">
      </div>

      <div
        id="captionLocation"
        class="caption-location">
      </div>

    </div>


    <!-- COUNTER -->

    <div
      id="counter"
      class="counter">
      01 / 20
    </div>


    <!-- THUMBNAILS -->

    <div class="thumbnails-wrapper" id="thumbnailWrapper">

      <div class="thumbnails" id="thumbnails">

      </div>

    </div>

  </div>


  <script>

    /*
      ============================================
      GALERÍA
      ============================================

      Agrega o elimina fotografías aquí.

      image  = ruta de la fotografía
      es     = nombre en español
      en     = nombre en inglés
      place  = lugar

      Puedes tener 10, 20, 30, etc.
    */

    const photos = [

      {
        image: "ospreyMJG-mobile.jpg",
        es: "Águila Pescadora",
        en: "Osprey",
        place: "Jalisco, México"
      },

      {
        image: "photos/teco1.jpg",
        es: "Tecole Ojos Oscuros",
        en: "Flammulated Owl",
        place: "Jalisco, México"
      },

      {
        image: "photos/colibri.jpg",
        es: "Fandanguero Mexicano",
        en: "Wedge-tailed Sabrewing",
        place: "Veracruz, México"
      },

      {
        image: "photos/teco2.jpg",
        es: "Tecolotito Serrano",
        en: "Northern Pygmy Owl",
        place: "Jalisco, México"
      },

      {
        image: "photos/trogon.jpg",
        es: "Trogón de Collar",
        en: "Collared Trogon",
        place: "Chiapas, México"
      },

      {
        image: "photos/flamingo.jpg",
        es: "Flamenco",
        en: "Flamingo",
        place: "Yucatán, México"
      },

      {
        image: "photos/guacas.jpg",
        es: "Guacamaya Verde",
        en: "Military Macaw",
        place: "Jalisco, México"
      },

      {
        image: "photos/cent.jpg",
        es: "Centzontle Norteño",
        en: "Northern Mockingbird",
        place: "Jalisco, México"
      },

      {
        image: "photos/deer.jpg",
        es: "Venado Cola Blanca",
        en: "White Tailed Deer",
        place: "Jalico, México"
      },

      /*
        ========================================
        MÁS FOTOS
        ========================================

        Copia este bloque para agregar otra:

        {
          image: "photos/foto10.jpg",
          es: "Nombre español",
          en: "English name",
          place: "Lugar"
        },

      */

    ];


    const mainImage =
      document.getElementById("mainImage");

    const captionTitle =
      document.getElementById("captionTitle");

    const captionLocation =
      document.getElementById("captionLocation");

    const counter =
      document.getElementById("counter");

    const thumbnails =
      document.getElementById("thumbnails");

    const thumbnailWrapper =
      document.getElementById("thumbnailWrapper");


    let currentIndex = 0;


    /*
      ============================================
      CREAR MINIATURAS
      ============================================
    */

    photos.forEach((photo, index) => {

      const thumbnail =
        document.createElement("div");

      thumbnail.className = "thumbnail";

      const img =
        document.createElement("img");

      img.src = photo.image;
      img.alt = "";

      thumbnail.appendChild(img);

      thumbnail.addEventListener("click", () => {
        showImage(index);
      });

      thumbnails.appendChild(thumbnail);

    });


    /*
      ============================================
      MOSTRAR IMAGEN
      ============================================
    */

    function showImage(index) {

      currentIndex = index;

      const photo = photos[currentIndex];

      /*
        Fade out
      */

      mainImage.classList.remove("visible");


      setTimeout(() => {

        mainImage.src = photo.image;

        mainImage.alt =
          currentLanguage === "en"
            ? photo.en
            : photo.es;

        captionTitle.textContent =
          currentLanguage === "en"
            ? photo.en
            : photo.es;

        captionLocation.textContent =
          photo.place;

        counter.textContent =
          String(currentIndex + 1).padStart(2, "0")
          + " / "
          + String(photos.length).padStart(2, "0");


        /*
          Fade in cuando la imagen
          realmente terminó de cargar.
        */

        if (mainImage.complete) {

          mainImage.classList.add("visible");

        } else {

          mainImage.onload = () => {
            mainImage.classList.add("visible");
          };

        }

      }, 180);


      /*
        Actualizar miniaturas
      */

      document
        .querySelectorAll(".thumbnail")
        .forEach((thumb, i) => {

          thumb.classList.toggle(
            "active",
            i === currentIndex
          );

        });


      /*
        Llevar thumbnail activo
        hacia el centro cuando sea posible.
      */

      const activeThumbnail =
        thumbnails.children[currentIndex];

      if (activeThumbnail) {

        activeThumbnail.scrollIntoView({
          behavior: "smooth",
          block: "nearest",
          inline: "center"
        });

      }


      /*
        Precargar siguiente y anterior
      */

      preloadImage(
        photos[(currentIndex + 1) % photos.length].image
      );

      preloadImage(
        photos[
          (currentIndex - 1 + photos.length)
          % photos.length
        ].image
      );

    }


    /*
      ============================================
      PRELOAD
      ============================================
    */

    function preloadImage(src) {

      const img =
        new Image();

      img.src = src;

    }


    /*
      ============================================
      SIGUIENTE / ANTERIOR
      ============================================
    */

    function nextImage() {

      showImage(
        (currentIndex + 1)
        % photos.length
      );

    }


    function prevImage() {

      showImage(
        (currentIndex - 1 + photos.length)
        % photos.length
      );

    }


    /*
      ============================================
      TECLADO
      ============================================
    */

    document.addEventListener(
      "keydown",
      function(e) {

        if (e.key === "ArrowRight") {
          nextImage();
        }

        if (e.key === "ArrowLeft") {
          prevImage();
        }

      }
    );


    /*
      ============================================
      SWIPE MOBILE
      ============================================
    */

    let touchStartX = 0;
    let touchEndX = 0;


    mainImage.addEventListener(
      "touchstart",
      function(e) {

        touchStartX =
          e.changedTouches[0].screenX;

      },
      { passive: true }
    );


    mainImage.addEventListener(
      "touchend",
      function(e) {

        touchEndX =
          e.changedTouches[0].screenX;

        const distance =
          touchEndX - touchStartX;


        if (Math.abs(distance) < 50) {
          return;
        }


        if (distance < 0) {
          nextImage();
        } else {
          prevImage();
        }

      },
      { passive: true }
    );


    /*
      ============================================
      IDIOMA
      ============================================
    */

    let currentLanguage =
      localStorage.getItem("lang") || "es";


    function setLang(lang) {

      localStorage.setItem(
        "lang",
        lang
      );

      currentLanguage = lang;

      updateLang();

      /*
        Actualizar caption actual
      */

      const photo =
        photos[currentIndex];

      captionTitle.textContent =
        currentLanguage === "en"
          ? photo.en
          : photo.es;

    }


    function updateLang() {

      const elements =
        document.querySelectorAll(
          "[data-es]"
        );


      elements.forEach(el => {

        const text =
          el.getAttribute(
            `data-${currentLanguage}`
          );

        if (text) {
          el.textContent = text;
        }

      });


      const toggles =
        document.querySelectorAll(
          ".lang-toggle span"
        );


      toggles.forEach(el => {

        el.classList.remove("active");

        if (
          el.textContent.toLowerCase()
          === currentLanguage
        ) {

          el.classList.add("active");

        }

      });

    }


    /*
      ============================================
      INICIALIZAR
      ============================================
    */

    updateLang();

    showImage(0);

  </script>

</body>
</html>
