<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Galería | Manuel Jiménez</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="favicon.png">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    header {
      padding: 30px 40px;
      position: relative;
    }

    header a {
      color: #ccc;
      text-decoration: none;
      font-size: 13px;
    }

    header a:hover {
      color: white;
    }

    /* TOGGLE */
    .lang-toggle {
      position: absolute;
      top: 30px;
      right: 40px;
      font-size: 12px;
    }

    .lang-toggle span {
      margin-left: 10px;
      cursor: pointer;
      color: #aaa;
      transition: 0.3s;
    }

    .lang-toggle span:hover {
      color: white;
    }

    .lang-toggle .active {
      color: white;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 32px;
      margin: 0 40px 30px 40px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 0 40px 40px 40px;
    }

    .gallery-item {
      aspect-ratio: 3 / 2;
      overflow: hidden;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
      transition: 0.3s;
    }

    .gallery-item img:hover {
      opacity: 0.85;
      transform: scale(1.02);
    }

    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.96);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 999;
    }

    .lightbox.active {
      opacity: 1;
      pointer-events: all;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      transition: opacity 0.3s ease;
    }

    /* Flechas */
    .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 30px;
      color: white;
      cursor: pointer;
      padding: 20px;
      opacity: 0.6;
      user-select: none;
    }

    .nav:hover {
      opacity: 1;
    }

    .prev { left: 20px; }
    .next { right: 20px; }

    /* Mobile */
    @media (max-width: 600px) {
      .gallery {
        grid-template-columns: 1fr;
        padding: 0 20px 20px 20px;
      }

      h1 {
        font-size: 24px;
        margin: 0 20px 20px 20px;
      }

      header {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html" data-="← Volver" data-en="← Back">← Volver</a>

    <div class="lang-toggle">
      <span onclick="setLang('es')">ES</span> 
      <span onclick="setLang('en')">EN</span>
    </div>
  </header>

  <h1 data-es="Galería" data-en="Gallery">Galería</h1>

  <div class="gallery">
    <div class="gallery-item"><img src="ospreyMJG-mobile.jpg"></div>
    <div class="gallery-item"><img src="photos/teco1.jpg"></div>
    <div class="gallery-item"><img src="photos/colibri.jpg"></div>
    <div class="gallery-item"><img src="photos/teco2.jpg"></div>
    <div class="gallery-item"><img src="photos/trogon.jpg"></div>
    <div class="gallery-item"><img src="photos/flamingo.jpg"></div>
    <div class="gallery-item"><img src="photos/guacas.jpg"></div>
    <div class="gallery-item"><img src="photos/cent.jpg"></div>
    <div class="gallery-item"><img src="photos/deer.jpg"></div>
  </div>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <span class="nav prev">&#10094;</span>
    <img id="lightbox-img">
    <span class="nav next">&#10095;</span>
  </div>

  <script>
    const images = document.querySelectorAll('.gallery-item img');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    let currentIndex = 0;

    images.forEach((img, index) => {
      img.addEventListener('click', () => {
        currentIndex = index;
        showImage();
        lightbox.classList.add('active');
      });
    });

    function showImage() {
      lightboxImg.style.opacity = 0;

      setTimeout(() => {
        lightboxImg.src = images[currentIndex].src;
        lightboxImg.style.opacity = 1;
      }, 150);
    }

    function nextImage() {
      currentIndex = (currentIndex + 1) % images.length;
      showImage();
    }

    function prevImage() {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      showImage();
    }

    document.querySelector('.next').onclick = nextImage;
    document.querySelector('.prev').onclick = prevImage;

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) {
        lightbox.classList.remove('active');
      }
    });

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return;

      if (e.key === 'ArrowRight') nextImage();
      if (e.key === 'ArrowLeft') prevImage();
      if (e.key === 'Escape') lightbox.classList.remove('active');
    });

    let startX = 0;

    lightbox.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
    });

    lightbox.addEventListener('touchend', e => {
      let endX = e.changedTouches[0].clientX;

      if (endX - startX > 50) prevImage();
      if (startX - endX > 50) nextImage();
    });

    /* LANG */
    function setLang(lang) {
      localStorage.setItem("lang", lang);
      updateLang();
    }

    function updateLang() {
      const lang = localStorage.getItem("lang") || "es";
      const elements = document.querySelectorAll("[data-es]");
      const toggles = document.querySelectorAll(".lang-toggle span");

      elements.forEach(el => {
        el.textContent = el.getAttribute(`data-${lang}`);
      });

      toggles.forEach(el => {
        el.classList.remove("active");
        if (el.textContent.toLowerCase() === lang) {
          el.classList.add("active");
        }
      });
    }

    updateLang();
  </script>

</body>
</html>
