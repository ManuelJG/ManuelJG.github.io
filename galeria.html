<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Galería | Manuel Jiménez</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="favicon.png">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    header {
      padding: 30px 40px;
    }

    header a {
      color: #ccc;
      text-decoration: none;
      font-size: 13px;
    }

    header a:hover {
      color: white;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 32px;
      margin: 0 40px 20px 40px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 0 40px 40px 40px;
    }

    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
      transition: 0.4s;
    }

    .gallery img:hover {
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .gallery {
        grid-template-columns: 1fr;
        padding: 0 20px 20px 20px;
      }

      h1 {
        font-size: 24px;
        margin: 0 20px 20px 20px;
      }

      header {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html">← Volver</a>
  </header>

  <h1>Galería</h1>

  <div class="gallery">
    <img src="foto1.jpg">
    <img src="foto2.jpg">
    <img src="foto3.jpg">
    <img src="foto4.jpg">
    <img src="foto5.jpg">
    <img src="foto6.jpg">
  </div>

</body>
</html>
