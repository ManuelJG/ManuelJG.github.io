<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Acerca de | Manuel Jiménez</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="favicon.png">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background-color: black;
      color: white;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 30px 40px;
      position: relative;
    }

    header a {
      color: #888;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 1px;
    }

    header a:hover {
      color: white;
    }

    .lang-toggle {
      position: absolute;
      top: 30px;
      right: 40px;
      font-size: 12px;
    }

    .lang-toggle span {
      margin-left: 10px;
      cursor: pointer;
      color: #aaa;
    }

    .lang-toggle .active {
      color: white;
    }

    .container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .content {
      max-width: 600px;
    }

    .portrait {
      width: 200px;
      margin-bottom: 30px;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeIn 1.2s ease forwards;
      animation-delay: 0.2s;
    }

    .portrait img {
      width: 100%;
      opacity: 0.95;
    }

    .flip {
      transform: scaleX(-1);
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      margin-bottom: 30px;
    }

    p {
      font-size: 15px;
      line-height: 1.7;
      color: #ccc;
      margin-bottom: 20px;
    }

    .contact {
      margin-top: 30px;
      font-size: 14px;
      color: #aaa;
    }

    .contact a {
      color: #ccc;
      text-decoration: none;
    }

    /* MAILING */
    .mailing-inline {
      margin-top: 50px;
    }

    .mailing-inline form {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .label {
      font-size: 13px;
      color: #aaa;
    }

    /* CONTENEDOR STACK */
    .input-stack {
      position: relative;
      width: 160px;
    }

    .input-stack input,
    .input-stack .final-message {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }

    .input-stack input {
      background: none;
      border: none;
      border-bottom: 1px solid #444;
      color: white;
      padding: 4px 2px;
      font-size: 13px;
      outline: none;
    }

    .input-stack input:focus {
      border-bottom: 1px solid #aaa;
    }

    .input-stack input::placeholder {
      color: #666;
    }

    .input-stack input.fade-out {
      opacity: 0;
      transform: translateY(5px);
    }

    .final-message {
      font-size: 13px;
      color: #aaa;
      opacity: 0;
      transform: translateY(5px);
      pointer-events: none;
      transition: 0.5s;
    }

    .final-message.show {
      opacity: 1;
      transform: translateY(0);
    }

    .mailing-inline button {
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 13px;
      transition: 0.3s;
    }

    .mailing-inline button.fade-out {
      opacity: 0;
      transform: translateY(5px);
    }

    .mailing-inline button:hover {
      color: white;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
        align-items: flex-start;
      }

      .portrait {
        width: 150px;
      }

      h1 {
        font-size: 24px;
      }

      .mailing-inline form {
        flex-direction: column;
        align-items: flex-start;
      }

      .input-stack {
        width: 100%;
        max-width: 220px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html" data-es="← Volver" data-en="← Back">← Volver</a>

    <div class="lang-toggle">
      <span onclick="setLang('es')">ES</span> /
      <span onclick="setLang('en')">EN</span>
    </div>
  </header>

  <div class="container">
    <div class="content">

      <div class="portrait">
        <img src="photos/hshot.jpg" class="flip" alt="Manuel Jiménez">
      </div>

      <h1 data-es="Manuel Jiménez" data-en="Manuel Jiménez">Manuel Jiménez</h1>

      <p data-es="Fotógrafo de vida silvestre en México."
         data-en="Wildlife photographer based in Mexico."></p>

      <p data-es="Observo y documento la vida que ocurre a nuestro alrededor."
         data-en="I observe and document the life that unfolds around us."></p>

      <p data-es="La naturaleza no está lejos. Sigue aquí."
         data-en="Nature is not far away. It is still here."></p>

      <div class="contact">
        <span data-es="Contacto:" data-en="Contact:"></span>
        <a href="mailto:m@manueljg.com">m@manueljg.com</a>
      </div>

      <div class="mailing-inline">
        <form id="form">

          <span class="label"
            data-es="Fotografías, de vez en cuando."
            data-en="Photographs, from time to time."></span>

          <div class="input-stack">
            <input id="email" type="email" name="email"
              data-es="tu correo"
              data-en="your email"
              placeholder="tu correo"
              required>

            <span id="finalMessage" class="final-message"
              data-es="Gracias. Te escribiré cuando haya algo que valga la pena."
              data-en="Thank you. I will write when there is something worth sharing."></span>
          </div>

          <input type="text" name="_gotcha" style="display:none">

          <button id="btn" type="submit"
            data-es="Suscribirme"
            data-en="Subscribe"></button>

        </form>
      </div>

    </div>
  </div>

  <script>
    const form = document.getElementById("form");
    const email = document.getElementById("email");
    const btn = document.getElementById("btn");
    const finalMessage = document.getElementById("finalMessage");

    form.addEventListener("submit", async function(e) {
      e.preventDefault();

      const data = new FormData(form);

      const response = await fetch("https://formspree.io/f/xvzvwqqd", {
        method: "POST",
        body: data,
        headers: { 'Accept': 'application/json' }
      });

      if (response.ok) {
        email.classList.add("fade-out");
        btn.classList.add("fade-out");

        setTimeout(() => {
          finalMessage.classList.add("show");
        }, 300);
      }
    });

    function setLang(lang) {
      localStorage.setItem("lang", lang);
      updateLang();
    }

    function updateLang() {
      const lang = localStorage.getItem("lang") || "es";
      const elements = document.querySelectorAll("[data-es]");
      const toggles = document.querySelectorAll(".lang-toggle span");

      elements.forEach(el => {
        if (el.tagName === "INPUT") {
          el.placeholder = el.getAttribute(`data-${lang}`);
        } else {
          el.textContent = el.getAttribute(`data-${lang}`);
        }
      });

      toggles.forEach(el => {
        el.classList.remove("active");
        if (el.textContent.toLowerCase() === lang) {
          el.classList.add("active");
        }
      });
    }

    updateLang();
  </script>

</body>
</html>
