<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Acerca de | Manuel Jiménez</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="favicon.png">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background-color: black;
      color: white;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 30px 40px;
    }

    header a {
      color: #888;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 1px;
    }

    header a:hover {
      color: white;
    }

    .container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .content {
      max-width: 600px;
      text-align: left;
    }

    .portrait {
      width: 200px;
      margin-bottom: 30px;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeIn 1.2s ease forwards;
      animation-delay: 0.2s;
    }

    .portrait img {
      width: 100%;
      opacity: 0.95;
    }

    .flip {
      transform: scaleX(-1);
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      margin-bottom: 30px;
    }

    p {
      font-size: 15px;
      line-height: 1.7;
      color: #ccc;
    }

    .contact {
      margin-top: 30px;
      font-size: 14px;
      color: #aaa;
    }

    /* MAILING */
    .mailing {
      margin-top: 40px;
    }

    .mailing p {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 10px;
    }

    .mailing form {
      display: flex;
      gap: 10px;
    }

    .mailing input {
      background: none;
      border: 1px solid #555;
      color: white;
      padding: 8px;
      font-size: 13px;
      flex: 1;
    }

    .mailing button {
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
    }

    .mailing button:hover {
      color: white;
    }

    /* MENSAJE */
    .success {
      margin-top: 10px;
      font-size: 13px;
      color: #aaa;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .success.show {
      opacity: 1;
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html">← Volver</a>
  </header>

  <div class="container">
    <div class="content">

      <div class="portrait">
        <img src="photos/hshot.jpg" class="flip" alt="Manuel Jiménez">
      </div>

      <h1>Manuel Jiménez</h1>

      <p>Fotógrafo de vida silvestre en México.</p>
      <p>Observo y documento la vida que ocurre a nuestro alrededor.</p>

      <div class="contact">
        Contacto: <a href="mailto:m@manueljg.com">m@manueljg.com</a>
      </div>

      <!-- MAILING -->
      <div class="mailing">
        <p>Fotografías, de vez en cuando.</p>

        <form id="form">
          <input type="email" name="email" placeholder="Tu correo" required>
          <input type="text" name="_gotcha" style="display:none">
          <button type="submit">Suscribirme</button>
        </form>

        <div id="success" class="success">
          Gracias. Te escribiré pronto.
        </div>
      </div>

    </div>
  </div>

  <script>
    const form = document.getElementById("form");
    const success = document.getElementById("success");

    form.addEventListener("submit", async function(e) {
      e.preventDefault();

      const data = new FormData(form);

      const response = await fetch("https://formspree.io/f/xvzvwqqd", {
        method: "POST",
        body: data,
        headers: {
          'Accept': 'application/json'
        }
      });

      if (response.ok) {
        form.reset();
        success.classList.add("show");
      } else {
        alert("Error al enviar. Intenta de nuevo.");
      }
    });
  </script>

</body>
</html>
