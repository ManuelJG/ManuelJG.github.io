<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Acerca de | Manuel Jiménez</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="favicon.png">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background-color: black;
      color: white;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 30px 40px;
      position: relative;
    }

    header a {
      color: #888;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 1px;
    }

    header a:hover {
      color: white;
    }

    .lang-toggle {
      position: absolute;
      top: 30px;
      right: 40px;
      font-size: 12px;
    }

    .lang-toggle span {
      margin-left: 10px;
      cursor: pointer;
      color: #aaa;
    }

    .lang-toggle .active {
      color: white;
    }

    .container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .content {
      max-width: 600px;
    }

    .portrait {
      width: 200px;
      margin-bottom: 30px;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeIn 1.2s ease forwards;
      animation-delay: 0.2s;
    }

    .portrait img {
      width: 100%;
      opacity: 0.95;
    }

    .flip {
      transform: scaleX(-1);
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      margin-bottom: 30px;
    }

    p {
      font-size: 15px;
      line-height: 1.7;
      color: #ccc;
      margin-bottom: 20px;
    }

    .contact {
      margin-top: 30px;
      font-size: 14px;
      color: #aaa;
    }

    .contact a {
      color: #ccc;
      text-decoration: none;
    }

    /* MAILING INLINE */
    .mailing-inline {
      margin-top: 50px;
    }

    .mailing-inline form {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .label {
      font-size: 13px;
      color: #aaa;
      white-space: nowrap;
    }

    .input-stack {
      position: relative;
      width: 140px;
    }

    .input-stack input,
    .input-stack .final-message {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }

    .input-stack input {
      background: none;
      border: none;
      border-bottom: 1px solid #444;
      color: white;
      padding: 4px 2px;
      font-size: 13px;
      outline: none;
    }

    .input-stack input:focus {
      border-bottom: 1px solid #aaa;
    }

    .input-stack input::placeholder {
      color: #666;
    }

    .input-stack input.fade-out {
      opacity: 0;
      transform: translateY(5px);
      transition: 0.3s;
    }

    .final-message {
      font-size: 13px;
      color: #aaa;
      opacity: 0;
      transform: translateY(5px);
      transition: 0.5s;
    }

    .final-message.show {
      opacity: 1;
      transform: translateY(0);
    }

    .mailing-inline button {
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 13px;
      transition: 0.3s;
    }

    .mailing-inline button.fade-out {
      opacity: 0;
      transform: translateY(5px);
    }

    .mailing-inline button:hover {
      color: white;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
        align-items: flex-start;
      }

      .portrait {
        width: 150px;
      }

      h1 {
        font-size: 24px;
      }

      .mailing-inline form {
        flex-direction: column;
        align-items: flex-start;
      }

      .input-stack {
        width: 100%;
        max-width: 200px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html">← Volver</a>

    <div class="lang-toggle">
      <span onclick="setLang('es')">ES</span> /
      <span onclick="setLang('en')">EN</span>
    </div>
  </header>

  <div class="container">
    <div class="content">

      <div class="portrait">
        <img src="photos/hshot.jpg" class="flip" alt="Manuel Jiménez">
      </div>

      <h1>Manuel Jiménez</h1>

      <p>Fotógrafo de vida silvestre en México.</p>

      <p>
        Observo y documento la vida que ocurre a nuestro alrededor.
      </p>

      <p>
        La naturaleza no está lejos.
        <br>Sigue aquí.
      </p>

      <div class="contact">
        Contacto: <a href="mailto:m@manueljg.com">m@manueljg.com</a>
      </div>

      <div class="mailing-inline">
        <form id="form">

          <span class="label">Fotografías, de vez en cuando →</span>

          <div class="input-stack">
            <input id="email" type="email" name="email" placeholder="tu correo" required>

            <span id="finalMessage" class="final-message">
              Gracias. Te escribiré.
            </span>
          </div>

          <input type="text" name="_gotcha" style="display:none">

          <button id="btn" type="submit">Enviar</button>

        </form>
      </div>

    </div>
  </div>

  <script>
    const form = document.getElementById("form");
    const email = document.getElementById("email");
    const btn = document.getElementById("btn");
    const finalMessage = document.getElementById("finalMessage");

    form.addEventListener("submit", async function(e) {
      e.preventDefault();

      const data = new FormData(form);

      const response = await fetch("https://formspree.io/f/xvzvwqqd", {
        method: "POST",
        body: data,
        headers: { 'Accept': 'application/json' }
      });

      if (response.ok) {
        email.classList.add("fade-out");
        btn.classList.add("fade-out");

        setTimeout(() => {
          btn.style.display = "none";
          finalMessage.classList.add("show");
        }, 300);
      }
    });
  </script>

</body>
</html>
