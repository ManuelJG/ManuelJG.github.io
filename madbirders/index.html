<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mad Birders — Calendario</title>


  <style>

    /* ========================================
       RESET
       ======================================== */

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;

      background: #111;
      color: #f5f5f5;
    }


    body {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background: #111;
      color: #f5f5f5;

    }


    /* ========================================
       CONTAINER
       ======================================== */

    .container {

      width: 100%;
      max-width: 1100px;

      margin: 0 auto;

      padding: 40px 20px;

    }


    /* ========================================
       HEADER
       ======================================== */

    header {
      margin-bottom: 30px;
    }


    .brand {

      display: flex;
      align-items: center;

      gap: 12px;

    }


    .logo {

      width: 48px;
      height: 48px;

      border-radius: 50%;

      object-fit: cover;

      display: block;

      border: 1px solid #333;

    }


    .brand-text h1 {

      margin: 0;

      color: #f5f5f5;

      font-size: 30px;

      font-weight: 600;

      letter-spacing: -0.5px;

      line-height: 1.1;

    }


    .subtitle {

      margin-top: 5px;

      color: #999;

      font-size: 15px;

    }


    /* ========================================
       CALENDAR
       ======================================== */

    .calendar {

      width: 100%;

      background: #1b1b1b;

      border: 1px solid #333;

      border-radius: 12px;

      overflow: hidden;

    }


    /* ========================================
       CALENDAR HEADER
       ======================================== */

    .calendar-header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 18px 20px;

      background: #1b1b1b;

      border-bottom: 1px solid #333;

    }


    .month-title {

      color: #f5f5f5;

      font-size: 20px;

      font-weight: 600;

      text-align: center;

    }


    button {

      width: 38px;
      height: 34px;

      padding: 0;

      border: 1px solid #444;

      border-radius: 7px;

      background: #242424;

      color: #f5f5f5;

      font-size: 17px;

      cursor: pointer;

      transition:
        background 0.15s ease,
        border-color 0.15s ease;

    }


    button:hover {

      background: #303030;

      border-color: #555;

    }


    /* ========================================
       WEEKDAYS
       ======================================== */

    .weekdays {

      display: grid;

      grid-template-columns:
        repeat(7, 1fr);

      background: #181818;

    }


    .weekday {

      padding: 12px 8px;

      text-align: center;

      color: #888;

      font-size: 11px;

      font-weight: 600;

      letter-spacing: 0.5px;

      border-bottom: 1px solid #333;

    }


    /* ========================================
       DAYS GRID
       ======================================== */

    .days {

      display: grid;

      grid-template-columns:
        repeat(7, 1fr);

      background: #333;

      gap: 1px;

    }


    .day {

      min-height: 110px;

      padding: 8px;

      background: #1b1b1b;

      overflow: hidden;

    }


    /* ========================================
       DATE NUMBER
       ======================================== */

    .date {

      margin-bottom: 7px;

      color: #888;

      font-size: 13px;

      font-weight: 400;

    }


    /* ========================================
       TODAY
       ======================================== */

    .today {

      background: #222;

    }


    .today .date {

      color: #fff;

      font-weight: 700;

    }


    /* ========================================
       EVENTS
       ======================================== */

    .event {

      margin-bottom: 4px;

      padding: 6px 7px;

      border-radius: 5px;

      background: #dedede;

      color: #111;

      font-size: 12px;

      line-height: 1.3;

      overflow: hidden;

    }


    .event-time {

      margin-bottom: 2px;

      color: #555;

      font-size: 10px;

    }


    .event-location {

      margin-top: 3px;

      color: #666;

      font-size: 10px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

    }


    /* ========================================
       UPCOMING EVENTS
       ======================================== */

    .upcoming {

      margin-top: 35px;

    }


    .upcoming-title {

      margin: 0 0 16px 0;

      color: #f5f5f5;

      font-size: 20px;

      font-weight: 600;

    }


    .upcoming-list {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 14px;

    }


    .upcoming-card {

      min-height: 145px;

      padding: 18px;

      background: #1b1b1b;

      border: 1px solid #333;

      border-radius: 10px;

      transition:
        background 0.15s ease,
        border-color 0.15s ease;

    }


    .upcoming-card:hover {

      background: #202020;

      border-color: #444;

    }


    .upcoming-date {

      margin-bottom: 10px;

      color: #888;

      font-size: 12px;

      font-weight: 600;

      text-transform: uppercase;

      letter-spacing: 0.5px;

    }


    .upcoming-event-title {

      margin-bottom: 8px;

      color: #f5f5f5;

      font-size: 17px;

      font-weight: 600;

      line-height: 1.25;

    }


    .upcoming-contact {

      margin-bottom: 6px;

      color: #aaa;

      font-size: 12px;

    }


    .upcoming-time {

      margin-bottom: 4px;

      color: #aaa;

      font-size: 12px;

    }


    .upcoming-location {

      color: #777;

      font-size: 12px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

    }


    .no-upcoming {

      padding: 25px;

      background: #1b1b1b;

      border: 1px solid #333;

      border-radius: 10px;

      color: #888;

      text-align: center;

    }


    /* ========================================
       LOADING
       ======================================== */

    .loading {

      grid-column: 1 / -1;

      padding: 40px;

      text-align: center;

      color: #888;

      background: #1b1b1b;

    }


    /* ========================================
       ERROR
       ======================================== */

    .error {

      grid-column: 1 / -1;

      padding: 40px;

      text-align: center;

      color: #ff7777;

      background: #1b1b1b;

    }


    /* ========================================
       MOBILE
       ======================================== */

    @media (max-width: 700px) {

      .container {

        padding: 25px 10px;

      }


      .brand {

        gap: 10px;

      }


      .logo {

        width: 40px;
        height: 40px;

      }


      .brand-text h1 {

        font-size: 25px;

      }


      .subtitle {

        font-size: 14px;

      }


      .calendar-header {

        padding: 14px;

      }


      .month-title {

        font-size: 17px;

      }


      button {

        width: 34px;
        height: 32px;

      }


      .weekday {

        padding: 10px 2px;

        font-size: 9px;

      }


      .day {

        min-height: 85px;

        padding: 5px;

      }


      .date {

        font-size: 11px;

        margin-bottom: 5px;

      }


      .event {

        padding: 4px;

        font-size: 10px;

      }


      .event-time {

        font-size: 9px;

      }


      .event-location {

        display: none;

      }


      /* UPCOMING MOBILE */

      .upcoming {

        margin-top: 28px;

      }


      .upcoming-title {

        font-size: 18px;

      }


      .upcoming-list {

        grid-template-columns: 1fr;

        gap: 10px;

      }


      .upcoming-card {

        min-height: auto;

        padding: 15px;

      }


      .upcoming-event-title {

        font-size: 16px;

      }

    }

  </style>

</head>


<body>


  <div class="container">


    <!-- ====================================
         HEADER
         ==================================== -->

    <header>

      <div class="brand">


        <img
          src="mad.PNG"
          alt="Mad Birders"
          class="logo"
        >


        <div class="brand-text">

          <h1>Mad Birders</h1>

          <div class="subtitle">
            Calendario de salidas
          </div>

        </div>


      </div>

    </header>


    <!-- ====================================
         CALENDAR
         ==================================== -->

    <div class="calendar">


      <!-- NAVIGATION -->

      <div class="calendar-header">

        <button id="previous">
          ←
        </button>


        <div
          class="month-title"
          id="monthTitle"
        >
          Cargando...
        </div>


        <button id="next">
          →
        </button>

      </div>


      <!-- WEEKDAYS -->

      <div class="weekdays">

        <div class="weekday">LUN</div>
        <div class="weekday">MAR</div>
        <div class="weekday">MIÉ</div>
        <div class="weekday">JUE</div>
        <div class="weekday">VIE</div>
        <div class="weekday">SÁB</div>
        <div class="weekday">DOM</div>

      </div>


      <!-- DAYS -->

      <div
        id="calendarDays"
        class="days"
      >

        <div class="loading">
          Cargando calendario...
        </div>

      </div>


    </div>


    <!-- ====================================
         UPCOMING EVENTS
         ==================================== -->

    <section class="upcoming">


      <h2 class="upcoming-title">
        Próximas salidas
      </h2>


      <div
        id="upcomingList"
        class="upcoming-list"
      >

        <div class="loading">
          Cargando próximas salidas...
        </div>

      </div>


    </section>


  </div>


<script>


/* ==========================================
   GOOGLE APPS SCRIPT
   ========================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbw3FijG4k9npjgom8U-yLfMCDVzKF_VnQWkCk8r3i9eDqayroqb5mrsjLgn3t729TY/exec";


/* ==========================================
   VARIABLES
   ========================================== */

let events = [];

let currentDate = new Date();


/* ==========================================
   LOAD CALENDAR
   ========================================== */

async function loadCalendar() {

  try {

    const response =
      await fetch(API_URL);


    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );

    }


    const result =
      await response.json();


    console.log(
      "Respuesta API:",
      result
    );


    if (!result.success) {

      throw new Error(
        result.error ||
        "Error obteniendo calendario"
      );

    }


    events =
      parseICS(
        result.data
      );


    console.log(
      "Eventos encontrados:",
      events
    );


    renderCalendar();

    renderUpcoming();


  } catch (error) {

    console.error(
      "Error:",
      error
    );


    document
      .getElementById(
        "calendarDays"
      )
      .innerHTML =

      '<div class="error">' +

      'No se pudo cargar el calendario.' +

      '<br>' +

      '<small>' +

      error.message +

      '</small>' +

      '</div>';


    document
      .getElementById(
        "upcomingList"
      )
      .innerHTML =

      '<div class="error">' +

      'No se pudieron cargar las próximas salidas.' +

      '</div>';

  }

}


/* ==========================================
   PARSE ICS
   ========================================== */

function parseICS(data) {

  const parsedEvents = [];


  /*
   * Unir líneas continuadas
   */

  data =
    data.replace(
      /\r?\n[ \t]/g,
      ""
    );


  /*
   * Separar eventos
   */

  const blocks =
    data.split(
      "BEGIN:VEVENT"
    );


  blocks.forEach(
    block => {


      if (
        !block.includes(
          "END:VEVENT"
        )
      ) {

        return;

      }


      function getValue(name) {

        const regex =
          new RegExp(
            "^" +
            name +
            "(?:;[^:]*)?:(.*)$",
            "mi"
          );


        const match =
          block.match(
            regex
          );


        return match
          ? match[1].trim()
          : "";

      }


      const dtstart =
        getValue(
          "DTSTART"
        );


      const dtend =
        getValue(
          "DTEND"
        );


      const summary =
        getValue(
          "SUMMARY"
        );


      const location =
        getValue(
          "LOCATION"
        );


      const description =
        getValue(
          "DESCRIPTION"
        );


      if (
        !dtstart ||
        !summary
      ) {

        return;

      }


      /*
       * IMPORTANTE
       *
       * DTSTART de 8 caracteres:
       *
       * 20260918
       *
       * significa evento de
       * día completo.
       *
       * Si tiene:
       *
       * 20260918T183000
       *
       * tiene hora.
       */

      const allDay =
        dtstart.length === 8;


      parsedEvents.push({

        date:
          parseICSDate(
            dtstart
          ),


        end:
          dtend
            ? parseICSDate(
                dtend
              )
            : null,


        allDay:
          allDay,


        title:
          cleanICS(
            summary
          ),


        location:
          cleanICS(
            location
          ),


        description:
          cleanICS(
            description
          )

      });

    }
  );


  return parsedEvents;

}


/* ==========================================
   PARSE DATE
   ========================================== */

function parseICSDate(value) {


  /*
   * Evento de día completo
   *
   * 20260918
   */

  if (
    value.length === 8
  ) {

    const year =
      Number(
        value.substring(
          0,
          4
        )
      );


    const month =
      Number(
        value.substring(
          4,
          6
        )
      ) - 1;


    const day =
      Number(
        value.substring(
          6,
          8
        )
      );


    return new Date(
      year,
      month,
      day
    );

  }


  /*
   * Fecha + hora
   *
   * 20260918T183000
   */

  const clean =
    value.replace(
      /Z$/,
      ""
    );


  const year =
    Number(
      clean.substring(
        0,
        4
      )
    );


  const month =
    Number(
      clean.substring(
        4,
        6
      )
    ) - 1;


  const day =
    Number(
      clean.substring(
        6,
        8
      )
    );


  const hour =
    Number(
      clean.substring(
        9,
        11
      )
    );


  const minute =
    Number(
      clean.substring(
        11,
        13
      )
    );


  return new Date(
    year,
    month,
    day,
    hour,
    minute
  );

}


/* ==========================================
   CLEAN TEXT
   ========================================== */

function cleanICS(value) {

  return value

    .replace(
      /\\n/g,
      " "
    )

    .replace(
      /\\,/g,
      ","
    )

    .replace(
      /\\;/g,
      ";"
    )

    .replace(
      /\\\\/g,
      "\\"
    );

}


/* ==========================================
   GET CONTACT FROM NOTES
   ========================================== */

function getContact(
  description
) {

  if (
    !description
  ) {

    return "";

  }


  const match =
    description.match(
      /^Contacto:\s*(.+)$/i
    );


  return match
    ? match[1].trim()
    : "";

}


/* ==========================================
   EVENT OCCURS ON DAY
   ========================================== */

function eventOccursOnDay(
  event,
  dayStart,
  dayEnd
) {


  /*
   * Todos los eventos se manejan
   * como intervalos:
   *
   * START incluido
   * END excluido
   *
   * Esto funciona tanto para
   * eventos con hora como para
   * eventos de día completo.
   */

  if (event.end) {

    return (

      event.date < dayEnd &&

      event.end > dayStart

    );

  }


  return (

    event.date >= dayStart &&

    event.date < dayEnd

  );

}


/* ==========================================
   RENDER CALENDAR
   ========================================== */

function renderCalendar() {


  const year =
    currentDate.getFullYear();


  const month =
    currentDate.getMonth();


  /*
   * Nombre del mes
   */

  const monthName =
    currentDate.toLocaleDateString(
      "es-MX",
      {
        month: "long",
        year: "numeric"
      }
    );


  document
    .getElementById(
      "monthTitle"
    )
    .textContent =

    monthName
      .charAt(0)
      .toUpperCase() +

    monthName.slice(1);


  /*
   * Limpiar calendario
   */

  const container =
    document.getElementById(
      "calendarDays"
    );


  container.innerHTML =
    "";


  /*
   * Primer día del mes
   */

  const firstDay =
    new Date(
      year,
      month,
      1
    ).getDay();


  /*
   * Domingo = 0
   *
   * Convertimos a:
   *
   * Lunes = 0
   */

  const offset =
    firstDay === 0
      ? 6
      : firstDay - 1;


  /*
   * Días del mes
   */

  const daysInMonth =
    new Date(
      year,
      month + 1,
      0
    ).getDate();


  /*
   * Celdas vacías
   */

  for (
    let i = 0;
    i < offset;
    i++
  ) {

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "day";


    container.appendChild(
      empty
    );

  }


  /*
   * Crear días
   */

  for (
    let day = 1;
    day <= daysInMonth;
    day++
  ) {


    const cell =
      document.createElement(
        "div"
      );


    cell.className =
      "day";


    /*
     * Inicio del día
     */

    const dayStart =
      new Date(
        year,
        month,
        day,
        0,
        0,
        0,
        0
      );


    /*
     * Fin del día
     */

    const dayEnd =
      new Date(
        year,
        month,
        day + 1,
        0,
        0,
        0,
        0
      );


    /*
     * Hoy
     */

    const today =
      new Date();


    if (

      dayStart.getFullYear() ===
        today.getFullYear()

      &&

      dayStart.getMonth() ===
        today.getMonth()

      &&

      dayStart.getDate() ===
        today.getDate()

    ) {

      cell.classList.add(
        "today"
      );

    }


    /*
     * Número del día
     */

    const dateElement =
      document.createElement(
        "div"
      );


    dateElement.className =
      "date";


    dateElement.textContent =
      day;


    cell.appendChild(
      dateElement
    );


    /*
     * Eventos del día
     */

    const dayEvents =
      events.filter(
        event =>

          eventOccursOnDay(
            event,
            dayStart,
            dayEnd
          )

      );


    /*
     * Dibujar eventos
     */

    dayEvents.forEach(
      event => {


        const eventElement =
          document.createElement(
            "div"
          );


        eventElement.className =
          "event";


        /*
         * Mostrar hora solamente
         * cuando realmente existe.
         */

        const hasTime =

          !event.allDay &&

          (

            event.date.getHours() !== 0 ||

            event.date.getMinutes() !== 0

          );


        if (hasTime) {


          const timeElement =
            document.createElement(
              "div"
            );


          timeElement.className =
            "event-time";


          timeElement.textContent =
            event.date.toLocaleTimeString(
              "es-MX",
              {
                hour: "2-digit",
                minute: "2-digit"
              }
            );


          eventElement.appendChild(
            timeElement
          );

        }


        /*
         * Título
         */

        const titleElement =
          document.createElement(
            "div"
          );


        titleElement.textContent =
          event.title;


        eventElement.appendChild(
          titleElement
        );


        /*
         * Ubicación
         */

        if (
          event.location
        ) {


          const locationElement =
            document.createElement(
              "div"
            );


          locationElement.className =
            "event-location";


          locationElement.textContent =
            event.location;


          eventElement.appendChild(
            locationElement
          );


          eventElement.title =
            event.location;

        }


        cell.appendChild(
          eventElement
        );

      }
    );


    container.appendChild(
      cell
    );

  }

}


/* ==========================================
   FORMAT UPCOMING DATE
   ========================================== */

function formatUpcomingDate(
  event
) {


  const start =
    event.date;


  /*
   * No hay fecha final
   */

  if (!event.end) {

    return formatDate(
      start
    );

  }


  /*
   * EVENTO DE DÍA COMPLETO
   *
   * DTEND es exclusivo.
   *
   * Ejemplo:
   *
   * DTSTART: 20260918
   * DTEND:   20260921
   *
   * significa:
   *
   * 18, 19 y 20
   *
   * Por eso aquí sí
   * restamos un día.
   */

  let end =
    new Date(
      event.end.getTime()
    );


  if (
    event.allDay
  ) {

    end.setDate(
      end.getDate() - 1
    );

  }


  /*
   * Mismo día
   */

  if (

    start.getFullYear() ===
      end.getFullYear()

    &&

    start.getMonth() ===
      end.getMonth()

    &&

    start.getDate() ===
      end.getDate()

  ) {

    return formatDate(
      start
    );

  }


  /*
   * Varios días
   */

  return (

    formatDate(start) +

    " – " +

    formatDate(end)

  );

}


/* ==========================================
   FORMAT DATE
   ========================================== */

function formatDate(
  date
) {

  return date
    .toLocaleDateString(
      "es-MX",
      {
        day: "numeric",
        month: "short"
      }
    )
    .replace(
      ".",
      ""
    );

}


/* ==========================================
   RENDER UPCOMING EVENTS
   ========================================== */

function renderUpcoming() {


  const container =
    document.getElementById(
      "upcomingList"
    );


  /*
   * Ahora mismo
   */

  const now =
    new Date();


  /*
   * Obtener eventos que todavía
   * no han terminado.
   */

  const upcomingEvents =
    events

      .filter(
        event => {


          /*
           * Si tiene END,
           * usamos END para saber
           * si todavía está activo.
           */

          if (
            event.end
          ) {

            return (
              event.end > now
            );

          }


          /*
           * Sin END:
           * usamos START.
           */

          return (
            event.date >= now
          );

        }
      )


      /*
       * Orden cronológico
       */

      .sort(
        (a, b) =>

          a.date - b.date

      )


      /*
       * Solo las siguientes 3
       */

      .slice(
        0,
        3
      );


  /*
   * No hay eventos
   */

  if (
    upcomingEvents.length === 0
  ) {

    container.innerHTML =

      '<div class="no-upcoming">' +

      'No hay próximas salidas programadas.' +

      '</div>';

    return;

  }


  /*
   * Limpiar
   */

  container.innerHTML =
    "";


  /*
   * Crear tarjetas
   */

  upcomingEvents.forEach(
    event => {


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "upcoming-card";


      /*
       * Fecha
       */

      const dateElement =
        document.createElement(
          "div"
        );


      dateElement.className =
        "upcoming-date";


      dateElement.textContent =
        formatUpcomingDate(
          event
        );


      card.appendChild(
        dateElement
      );


      /*
       * Título
       */

      const titleElement =
        document.createElement(
          "div"
        );


      titleElement.className =
        "upcoming-event-title";


      titleElement.textContent =
        event.title;


      card.appendChild(
        titleElement
      );


      /*
       * Contacto
       */

      const contact =
        getContact(
          event.description
        );


      if (
        contact
      ) {


        const contactElement =
          document.createElement(
            "div"
          );


        contactElement.className =
          "upcoming-contact";


        contactElement.textContent =
          "Contacto: " + contact;


        card.appendChild(
          contactElement
        );

      }


      /*
       * Hora
       */

      const hasTime =

        !event.allDay &&

        (

          event.date.getHours() !== 0 ||

          event.date.getMinutes() !== 0

        );


      if (
        hasTime
      ) {


        const timeElement =
          document.createElement(
            "div"
          );


        timeElement.className =
          "upcoming-time";


        timeElement.textContent =
          event.date.toLocaleTimeString(
            "es-MX",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );


        card.appendChild(
          timeElement
        );

      }


      /*
       * Ubicación
       */

      if (
        event.location
      ) {


        const locationElement =
          document.createElement(
            "div"
          );


        locationElement.className =
          "upcoming-location";


        locationElement.textContent =
          event.location;


        locationElement.title =
          event.location;


        card.appendChild(
          locationElement
        );

      }


      container.appendChild(
        card
      );

    }
  );

}


/* ==========================================
   PREVIOUS MONTH
   ========================================== */

document
  .getElementById(
    "previous"
  )
  .addEventListener(
    "click",
    () => {

      currentDate.setMonth(
        currentDate.getMonth() - 1
      );


      renderCalendar();

    }
  );


/* ==========================================
   NEXT MONTH
   ========================================== */

document
  .getElementById(
    "next"
  )
  .addEventListener(
    "click",
    () => {

      currentDate.setMonth(
        currentDate.getMonth() + 1
      );


      renderCalendar();

    }
  );


/* ==========================================
   START
   ========================================== */

loadCalendar();


</script>


</body>

</html>
