<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Manuel Jimenez | Fotografía de naturaleza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Tipografía elegante -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background-color: black;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    .hero {
      position: relative;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    /* Imagen responsive */
    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Overlay MUY sutil */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.08);
    }

    .hero-text {
      position: absolute;
      bottom: 70px;
      left: 50px;
      max-width: 420px;
    }

    /* Nombre */
    .hero-text h2 {
      margin: 0 0 8px 0;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #bbbbbb;
    }

    /* Título */
    .hero-text h1 {
      margin: 0;
      font-family: 'Playfair Display', serif;
      font-size: 34px;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: 0.5px;
    }

    .hero-text p {
      margin-top: 14px;
      font-size: 14px;
      color: #cccccc;
      font-weight: 300;
    }

    .links {
      margin-top: 18px;
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    .links a {
      color: #cccccc;
      text-decoration: none;
      margin-right: 14px;
      transition: 0.3s;
    }

    .links a:hover {
      color: white;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      .hero-text {
        left: 25px;
        bottom: 12%;
      }

      .hero-text h1 {
        font-size: 20px;
      }

      .hero-text h2 {
        font-size: 11px;
      }

      .hero-text p {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="hero">

    <!-- Imagen responsive -->
    <picture>
      <source srcset="ospreyMJG-mobile.jpg" media="(max-width: 600px)">
      <img src="ospreyMJG.jpg" alt="Fotografía">
    </picture>

    <div class="overlay"></div>

    <div class="hero-text">
      <h2>Manuel Jiménez</h2>
      <h1>Fotografía de naturaleza</h1>
      <p>Impresiones disponibles · Contacto: m@manueljg.com</p>

      <div class="links">
        <a href="https://instagram.com/manueljigas" target="_blank">Instagram</a>
        <a href="https://www.facebook.com/manuel.jgas/" target="_blank">Facebook</a>
        <a href="https://youtube.com/@ManuelJG" target="_blank">YouTube</a>
        <a href="galeria.html">Galería</a>
      </div>
    </div>

  </div>

</body>
</html>
