<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Manuel Jimenez | Fotografía de naturaleza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="favicon.png">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background-color: black;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    .hero {
      position: relative;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    /* Imagen */
    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;

      /* Estado inicial */
      filter: blur(20px);
      transform: scale(1.05);
      transition: filter 1.2s ease, transform 1.2s ease;
    }

    /* Cuando carga */
    .hero img.loaded {
      filter: blur(0);
      transform: scale(1);
    }

    /* Overlay */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.08);
    }

    .hero-text {
      position: absolute;
      bottom: 70px;
      left: 50px;
      max-width: 420px;
    }

    .hero-text h2 {
      margin: 0 0 8px 0;
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #bbbbbb;
    }

    .hero-text h1 {
      margin: 0;
      font-family: 'Playfair Display', serif;
      font-size: 34px;
      font-weight: 400;
      line-height: 1.2;
    }

    .hero-text p {
      margin-top: 14px;
      font-size: 14px;
      color: #cccccc;
    }

    .links {
      margin-top: 18px;
      font-size: 13px;
    }

    .links a {
      color: #cccccc;
      text-decoration: none;
      margin-right: 14px;
      transition: 0.3s;
    }

    .links a:hover {
      color: white;
    }

    @media (max-width: 600px) {
      .hero-text {
        left: 25px;
        bottom: 12%;
      }

      .hero-text h1 {
        font-size: 20px;
      }

      .hero-text h2 {
        font-size: 11px;
      }

      .hero-text p {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="hero">

    <picture>
      <source srcset="ospreyMJG-mobile.jpg" media="(max-width: 600px)">
      <img id="hero-img" src="ospreyMJG.jpg" alt="Fotografía">
    </picture>

    <div class="overlay"></div>

    <div class="hero-text">
      <h2>Manuel Jiménez</h2>
      <h1>Fotografía de naturaleza</h1>
      <p>Impresiones disponibles · Contacto: m@manueljg.com</p>

      <div class="links">
        <a href="https://instagram.com/manueljigas" target="_blank">Instagram</a>
        <a href="https://www.facebook.com/manuel.jgas/" target="_blank">Facebook</a>
        <a href="https://youtube.com/@ManuelJG" target="_blank">YouTube</a>
        <a href="galeria.html">Galería</a>
        <a href="about.html">Acerca</a>
      </div>
    </div>

  </div>

  <script>
    const img = document.getElementById('hero-img');

    if (img.complete) {
      img.classList.add('loaded');
    } else {
      img.onload = () => {
        img.classList.add('loaded');
      };
    }
  </script>

</body>
</html>
