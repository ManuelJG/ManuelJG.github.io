<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Manuel Jimenez</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background-color: black;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    img.bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .firma {
      position: absolute;
      right: 5%;
      bottom: 12%;
      opacity: 0.75;
    }

    .firma img {
      height: 45px;
    }
  </style>
</head>

<body>
  <div class="container">
    <img class="bg" src="ospreyMJ.jpg">

    <div class="firma">
      <img src="firma.png" alt="firma">
    </div>
  </div>
</body>
</html>
