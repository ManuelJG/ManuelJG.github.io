<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Manuel Jimenez | Fotografía de naturaleza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background-color: black;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
      color: white;
    }

    .container {
      position: relative;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    /* Imagen */
    .bg {
      position: absolute;
      top: -5%;
      left: 0;
      width: 100%;
      height: 110%;
      object-fit: cover;
      transform: translateY(0);
      transition: transform 0.1s linear;
    }

    /* Texto */
    .info {
      position: absolute;
      bottom: 40px;
      left: 40px;
      font-size: 13px;
      color: rgba(255,255,255,0.75);
    }

    .info a {
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      margin-right: 10px;
    }

    .info a:hover {
      color: white;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .info {
        left: 20px;
        bottom: 25px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <img src="ospreyMJF.jpg" class="bg" id="bg">

    <div class="info">
      <p>m@manueljg.com</p>
      <p>
        <a href="https://instagram.com/manueljigas" target="_blank">Instagram</a>
        <a href="https://youtube.com/@ManuelJG" target="_blank">YouTube</a>
        <a href="https://www.facebook.com/manuel.jgas/" target="_blank">Facebook</a>
      </p>
    </div>
  </div>

  <script>
    const bg = document.getElementById("bg");

    window.addEventListener("scroll", () => {
      let scrollY = window.scrollY;
      bg.style.transform = "translateY(" + scrollY * 0.15 + "px)";
    });
  </script>

</body>
</html>
