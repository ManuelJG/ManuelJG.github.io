<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Manuel Jimenez</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background-color: black;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
    }

    .container {
      position: relative;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    /* Imagen */
    .bg {
      position: absolute;
      top: -5%;
      left: 0;
      width: 100%;
      height: 110%;
      object-fit: cover;
      transform: translateY(0);
      transition: transform 0.1s linear;
    }

    /* Bloque centrado */
    .center-block {
      position: absolute;
      left: 50%;
      bottom: 18%;
      transform: translateX(-50%);
      text-align: center;
    }

    /* Firma */
    .firma img {
      height: 80px;
      opacity: 0.75;
    }

    /* Contacto */
    .contacto {
      margin-top: 10px;
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      letter-spacing: 1px;
    }

    .contacto a {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      margin: 0 6px;
    }

    .contacto a:hover {
      color: white;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .firma img {
        height: 50px;
      }

      .center-block {
        bottom: 20%;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <img src="foto.jpg" class="bg" id="bg">

    <div class="center-block">
      <div class="firma">
        <img src="firma.png" alt="firma">
      </div>

      <div class="contacto">
        <p>m@manueljg.com</p>
        <p>
          <a href="https://instagram.com/manueljigas" target="_blank">IG</a> ·
          <a href="https://youtube.com/@ManuelJG" target="_blank">YT</a> ·
          <a href="https://www.facebook.com/manuel.jgas/" target="_blank">FB</a>
        </p>
      </div>
    </div>

  </div>

  <script>
    const bg = document.getElementById("bg");

    window.addEventListener("scroll", () => {
      let scrollY = window.scrollY;
      bg.style.transform = "translateY(" + scrollY * 0.15 + "px)";
    });
  </script>

</body>
</html>
