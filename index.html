<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Manuel Jimenez</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background-color: black;
      overflow-x: hidden;
    }

    .container {
      position: relative;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    /* Imagen */
    .bg {
      position: absolute;
      top: -5%;
      left: 0;
      width: 100%;
      height: 110%;
      object-fit: cover;
      transform: translateY(0);
      transition: transform 0.1s linear;
    }

    /* Firma centrada */
    .firma {
      position: absolute;
      left: 50%;
      bottom: 18%;
      transform: translateX(-50%);
      opacity: 0.75;
    }

    .firma img {
      height: 80px;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .firma img {
        height: 50px;
      }

      .firma {
        bottom: 20%;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <img src="foto.jpg" class="bg" id="bg">

    <div class="firma">
      <img src="firma.png" alt="firma">
    </div>
  </div>

  <script>
    const bg = document.getElementById("bg");

    window.addEventListener("scroll", () => {
      let scrollY = window.scrollY;
      bg.style.transform = "translateY(" + scrollY * 0.15 + "px)";
    });
  </script>

</body>
</html>
