<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Manuel Jimenez | Fotografía de naturaleza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: black;
      color: white;
    }

    .hero {
      position: relative;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Overlay oscuro ligero */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.3),
        rgba(0,0,0,0.6)
      );
    }

    /* Texto principal */
    .hero-text {
      position: absolute;
      bottom: 60px;
      left: 40px;
      max-width: 400px;
    }

    .hero-text h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .hero-text p {
      margin-top: 10px;
      font-size: 14px;
      color: #ccc;
    }

    /* Links */
    .links {
      margin-top: 15px;
      font-size: 13px;
    }

    .links a {
      color: #ccc;
      text-decoration: none;
      margin-right: 12px;
    }

    .links a:hover {
      color: white;
    }

    /* Firma */
    .firma {
      position: absolute;
      right: 5%;
      bottom: 12%;
      opacity: 0.75;
    }

    .firma img {
      height: 40px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .hero-text {
        left: 20px;
        bottom: 40px;
      }

      .hero-text h1 {
        font-size: 22px;
      }

      .firma img {
        height: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="hero">
    <img src="ospreyMJ.jpg" alt="Fotografía">

    <div class="overlay"></div>

    <div class="hero-text">
      <h1>Fotografía de naturaleza</h1>
      <p>Impresiones disponibles · Contacto: m@manueljg.com</p>

      <div class="links">
        <a href="https://instagram.com/manueljigas" target="_blank">Instagram</a>
        <a href="https://www.facebook.com/manuel.jgas/" target="_blank">Facebook</a>
        <a href="https://youtube.com/@ManuelJG" target="_blank">YouTube</a>
      </div>
    </div>

    <div class="firma">
      <img src="firma.png" alt="Firma">
    </div>
  </div>

</body>
</html>
