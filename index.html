<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Manuel Jimenez | Fotografía de naturaleza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
    body {
      margin: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 0;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 90%;
      padding: 20px;
    }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .info {
      margin-top: 20px;
      font-size: 14px;
    }

    a {
      color: white;
      text-decoration: none;
      margin: 0 8px;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="container">
    
    <img src="foto.png" alt="Fotografía">

    <div class="info">
      <p>Contacto: m@manueljg.com</p>
      
      <p>
        <a href="https://instagram.com/manueljigas" target="_blank">Instagram</a>
        <a href="https://youtube.com/@ManuelJG" target="_blank">YouTube</a>
        <a href="https://www.facebook.com/manuel.jgas/" target="_blank">Facebook</a>
      </p>
    </div>

  </div>
</body>
</html>
