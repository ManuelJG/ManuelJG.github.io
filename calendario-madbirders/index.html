<body>

<h1>MADBirders</h1>

<pre id="resultado">Probando calendario...</pre>

<script>

const calendarURL =
"https://p127-caldav.icloud.com/published/2/NDMyNjc5NDUzNDMyNjc5NA23XIvZzCpH6si4TbyqJTuXxoYWtTk7NKXNkzti_p2Rb_bzdJZ2xsnXVYuqrUhQFz_VsE2h2SGkqrruJWBSzFM";

fetch(calendarURL)
  .then(response => {

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    return response.text();

  })
  .then(data => {

    document.getElementById("resultado").textContent =
      data.substring(0, 2000);

  })
  .catch(error => {

    document.getElementById("resultado").textContent =
      "ERROR: " + error;

    console.error(error);

  });

</script>
