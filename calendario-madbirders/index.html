<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MADBirders — Calendario</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f5;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      margin-bottom: 30px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 600;
    }

    .subtitle {
      margin-top: 6px;
      color: #666;
      font-size: 16px;
    }

    .calendar {
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      border-bottom: 1px solid #ddd;
    }

    .month-title {
      font-size: 20px;
      font-weight: 600;
    }

    button {
      border: 1px solid #ccc;
      background: white;
      border-radius: 7px;
      padding: 7px 12px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #f2f2f2;
    }

    .weekdays,
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .weekday {
      padding: 12px 8px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: #777;
      border-bottom: 1px solid #eee;
    }

    .day {
      min-height: 110px;
      padding: 8px;
      border-right: 1px solid #eee;
      border-bottom: 1px solid #eee;
    }

    .day:nth-child(7n) {
      border-right: none;
    }

    .date {
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
    }

    .event {
      background: #222;
      color: white;
      border-radius: 5px;
      padding: 5px 7px;
      margin-bottom: 4px;
      font-size: 12px;
      line-height: 1.3;
    }

    .today .date {
      font-weight: 700;
      color: #000;
    }

    .loading {
      padding: 40px;
      text-align: center;
      color: #777;
    }

    .error {
      padding: 30px;
      text-align: center;
      color: #a00;
    }

    @media (max-width: 700px) {

      .container {
        padding: 25px 10px;
      }

      h1 {
        font-size: 26px;
      }

      .day {
        min-height: 80px;
        padding: 5px;
      }

      .event {
        font-size: 10px;
        padding: 4px;
      }

      .weekday {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>MADBirders</h1>
    <div class="subtitle">Calendario de salidas</div>
  </header>

  <div class="calendar">

    <div class="calendar-header">
      <button id="previous">←</button>

      <div class="month-title" id="monthTitle"></div>

      <button id="next">→</button>
    </div>

    <div class="weekdays">
      <div class="weekday">LUN</div>
      <div class="weekday">MAR</div>
      <div class="weekday">MIÉ</div>
      <div class="weekday">JUE</div>
      <div class="weekday">VIE</div>
      <div class="weekday">SÁB</div>
      <div class="weekday">DOM</div>
    </div>

    <div id="calendarDays" class="days">
      <div class="loading">Cargando calendario...</div>
    </div>

  </div>

</div>

<script>

  /*
   * Calendario público de iCloud
   */
  const calendarURL =
    "https://p127-caldav.icloud.com/published/2/NDMyNjc5NDUzNDMyNjc5NA23XIvZzCpH6si4TbyqJTuXxoYWtTk7NKXNkzti_p2Rb_bzdJZ2xsnXVYuqrUhQFz_VsE2h2SGkqrruJWBSzFM";


  /*
   * Proxy temporal para evitar CORS
   */
  const proxyURL =
    "https://api.allorigins.win/raw?url=" +
    encodeURIComponent(calendarURL);


  let events = [];
  let currentDate = new Date();


  /*
   * Descargar calendario
   */
  async function loadCalendar() {

    try {

      const response = await fetch(proxyURL);

      if (!response.ok) {
        throw new Error("No se pudo descargar el calendario");
      }

      const ics = await response.text();

      events = parseICS(ics);

      renderCalendar();

    } catch (error) {

      console.error(error);

      document.getElementById("calendarDays").innerHTML =
        '<div class="error">No se pudo cargar el calendario.</div>';

    }

  }


  /*
   * Parser básico de iCalendar
   */
  function parseICS(data) {

    const parsedEvents = [];

    const blocks = data.split("BEGIN:VEVENT");

    blocks.forEach(block => {

      if (!block.includes("END:VEVENT")) {
        return;
      }

      const getValue = (name) => {

        const regex =
          new RegExp("^" + name + "(?:;[^:]*)?:(.*)$", "mi");

        const match = block.match(regex);

        return match ? match[1].trim() : "";

      };

      const dtstart = getValue("DTSTART");
      const summary = getValue("SUMMARY");
      const location = getValue("LOCATION");

      if (!dtstart || !summary) {
        return;
      }

      parsedEvents.push({
        date: parseICSDate(dtstart),
        title: summary,
        location: location
      });

    });

    return parsedEvents;
  }


  /*
   * Convertir fecha ICS
   */
  function parseICSDate(value) {

    const clean = value.replace(/Z$/, "");

    const year = Number(clean.substring(0, 4));
    const month = Number(clean.substring(4, 6)) - 1;
    const day = Number(clean.substring(6, 8));

    const hour = clean.length >= 11
      ? Number(clean.substring(9, 11))
      : 0;

    const minute = clean.length >= 13
      ? Number(clean.substring(11, 13))
      : 0;

    return new Date(
      year,
      month,
      day,
      hour,
      minute
    );
  }


  /*
   * Dibujar calendario
   */
  function renderCalendar() {

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    const monthName =
      currentDate.toLocaleDateString("es-MX", {
        month: "long",
        year: "numeric"
      });

    document.getElementById("monthTitle").textContent =
      monthName.charAt(0).toUpperCase() +
      monthName.slice(1);


    const container =
      document.getElementById("calendarDays");

    container.innerHTML = "";


    /*
     * Primer día del mes
     * Convertimos domingo=0 a lunes=0
     */
    const firstDay =
      new Date(year, month, 1).getDay();

    const offset =
      firstDay === 0 ? 6 : firstDay - 1;


    const daysInMonth =
      new Date(year, month + 1, 0).getDate();


    /*
     * Espacios antes del primer día
     */
    for (let i = 0; i < offset; i++) {

      const empty = document.createElement("div");

      empty.className = "day";

      container.appendChild(empty);

    }


    /*
     * Días
     */
    for (let day = 1; day <= daysInMonth; day++) {

      const cell = document.createElement("div");

      cell.className = "day";


      const date = new Date(
        year,
        month,
        day
      );


      /*
       * Hoy
       */
      const today = new Date();

      if (
        date.getFullYear() === today.getFullYear() &&
        date.getMonth() === today.getMonth() &&
        date.getDate() === today.getDate()
      ) {

        cell.classList.add("today");

      }


      const dateElement =
        document.createElement("div");

      dateElement.className = "date";

      dateElement.textContent = day;

      cell.appendChild(dateElement);


      /*
       * Eventos del día
       */
      events
        .filter(event =>
          event.date.getFullYear() === year &&
          event.date.getMonth() === month &&
          event.date.getDate() === day
        )
        .forEach(event => {

          const eventElement =
            document.createElement("div");

          eventElement.className = "event";

          eventElement.textContent =
            event.title;

          cell.appendChild(eventElement);

        });


      container.appendChild(cell);

    }

  }


  /*
   * Navegación
   */
  document
    .getElementById("previous")
    .addEventListener("click", () => {

      currentDate.setMonth(
        currentDate.getMonth() - 1
      );

      renderCalendar();

    });


  document
    .getElementById("next")
    .addEventListener("click", () => {

      currentDate.setMonth(
        currentDate.getMonth() + 1
      );

      renderCalendar();

    });


  /*
   * Iniciar
   */
  loadCalendar();

</script>

</body>
</html><!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MADBirders</title>
</head>
<body>

  <h1>MADBirders</h1>
  <p>Calendario de salidas</p>

</body>
</html>
