<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MADBirders — Calendario</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f7f7f5;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      margin-bottom: 30px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 600;
    }

    .subtitle {
      margin-top: 6px;
      color: #666;
      font-size: 16px;
    }

    .calendar {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      border-bottom: 1px solid #ddd;
    }

    .month-title {
      font-size: 20px;
      font-weight: 600;
    }

    button {
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 7px;
      padding: 7px 12px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #f2f2f2;
    }

    .weekdays,
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .weekday {
      padding: 12px 8px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: #777;
      border-bottom: 1px solid #eee;
    }

    .day {
      min-height: 110px;
      padding: 8px;
      border-right: 1px solid #eee;
      border-bottom: 1px solid #eee;
    }

    .day:nth-child(7n) {
      border-right: none;
    }

    .date {
      font-size: 13px;
      color: #666;
      margin-bottom: 7px;
    }

    .event {
      background: #222;
      color: #fff;
      border-radius: 5px;
      padding: 6px 7px;
      margin-bottom: 4px;
      font-size: 12px;
      line-height: 1.3;
      cursor: default;
    }

    .event-time {
      opacity: 0.7;
      font-size: 10px;
      margin-bottom: 2px;
    }

    .today .date {
      font-weight: 700;
      color: #000;
    }

    .loading,
    .error {
      padding: 40px;
      text-align: center;
      color: #777;
      grid-column: 1 / -1;
    }

    .error {
      color: #a00;
    }

    @media (max-width: 700px) {

      .container {
        padding: 25px 10px;
      }

      h1 {
        font-size: 26px;
      }

      .day {
        min-height: 80px;
        padding: 5px;
      }

      .event {
        font-size: 10px;
        padding: 4px;
      }

      .weekday {
        font-size: 10px;
      }

      .event-time {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>MADBirders</h1>
    <div class="subtitle">Calendario de salidas</div>
  </header>

  <div class="calendar">

    <div class="calendar-header">

      <button id="previous">←</button>

      <div class="month-title" id="monthTitle">
        Cargando...
      </div>

      <button id="next">→</button>

    </div>

    <div class="weekdays">
      <div class="weekday">LUN</div>
      <div class="weekday">MAR</div>
      <div class="weekday">MIÉ</div>
      <div class="weekday">JUE</div>
      <div class="weekday">VIE</div>
      <div class="weekday">SÁB</div>
      <div class="weekday">DOM</div>
    </div>

    <div id="calendarDays" class="days">
      <div class="loading">
        Cargando calendario...
      </div>
    </div>

  </div>

</div>


<script>

  /*
   * Google Apps Script
   */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbw3FijG4k9npjgom8U-yLfMCDVzKF_VnQWkCk8r3i9eDqayroqb5mrsjLgn3t729TY/exec";


  let events = [];
  let currentDate = new Date();


  /*
   * Obtener calendario
   */

  async function loadCalendar() {

    try {

      const response = await fetch(API_URL);

      if (!response.ok) {
        throw new Error(
          "HTTP " + response.status
        );
      }

      const result = await response.json();

      console.log("Respuesta API:", result);


      if (!result.success) {

        throw new Error(
          result.error || "Error obteniendo calendario"
        );

      }


      /*
       * El Apps Script devuelve el .ics
       */

      events = parseICS(result.data);

      console.log("Eventos encontrados:", events);

      renderCalendar();


    } catch (error) {

      console.error("Error:", error);

      document.getElementById("calendarDays").innerHTML =
        '<div class="error">' +
        'No se pudo cargar el calendario.<br>' +
        '<small>' + error.message + '</small>' +
        '</div>';

    }

  }


  /*
   * Parser iCalendar
   */

  function parseICS(data) {

    const parsedEvents = [];

    /*
     * Unfold de líneas ICS.
     * Las líneas que empiezan con espacio
     * continúan la línea anterior.
     */

    data = data.replace(/\r?\n[ \t]/g, "");


    const blocks =
      data.split("BEGIN:VEVENT");


    blocks.forEach(block => {

      if (!block.includes("END:VEVENT")) {
        return;
      }


      function getValue(name) {

        const regex =
          new RegExp(
            "^" +
            name +
            "(?:;[^:]*)?:(.*)$",
            "mi"
          );

        const match =
          block.match(regex);

        return match
          ? match[1].trim()
          : "";

      }


      const dtstart =
        getValue("DTSTART");

      const dtend =
        getValue("DTEND");

      const summary =
        getValue("SUMMARY");

      const location =
        getValue("LOCATION");


      if (!dtstart || !summary) {
        return;
      }


      parsedEvents.push({

        date: parseICSDate(dtstart),

        end: dtend
          ? parseICSDate(dtend)
          : null,

        title: cleanICS(summary),

        location: cleanICS(location)

      });

    });


    return parsedEvents;

  }


  /*
   * Convertir fecha ICS
   */

  function parseICSDate(value) {

    /*
     * Eventos de día completo:
     * 20260829
     */

    if (value.length === 8) {

      const year =
        Number(value.substring(0, 4));

      const month =
        Number(value.substring(4, 6)) - 1;

      const day =
        Number(value.substring(6, 8));

      return new Date(
        year,
        month,
        day
      );

    }


    /*
     * Eventos con hora:
     * 20260829T070000
     */

    const clean =
      value.replace(/Z$/, "");


    const year =
      Number(clean.substring(0, 4));

    const month =
      Number(clean.substring(4, 6)) - 1;

    const day =
      Number(clean.substring(6, 8));

    const hour =
      Number(clean.substring(9, 11));

    const minute =
      Number(clean.substring(11, 13));


    return new Date(
      year,
      month,
      day,
      hour,
      minute
    );

  }


  /*
   * Limpiar texto ICS
   */

  function cleanICS(value) {

    return value
      .replace(/\\n/g, " ")
      .replace(/\\,/g, ",")
      .replace(/\\;/g, ";")
      .replace(/\\\\/g, "\\");

  }


  /*
   * Mostrar calendario
   */

  function renderCalendar() {

    const year =
      currentDate.getFullYear();

    const month =
      currentDate.getMonth();


    const monthName =
      currentDate.toLocaleDateString(
        "es-MX",
        {
          month: "long",
          year: "numeric"
        }
      );


    document.getElementById(
      "monthTitle"
    ).textContent =
      monthName.charAt(0).toUpperCase() +
      monthName.slice(1);


    const container =
      document.getElementById(
        "calendarDays"
      );


    container.innerHTML = "";


    /*
     * Primer día del mes
     *
     * JavaScript:
     * Domingo = 0
     * Lunes = 1
     *
     * Nosotros queremos:
     * Lunes = 0
     */

    const firstDay =
      new Date(
        year,
        month,
        1
      ).getDay();


    const offset =
      firstDay === 0
        ? 6
        : firstDay - 1;


    const daysInMonth =
      new Date(
        year,
        month + 1,
        0
      ).getDate();


    /*
     * Espacios antes del primer día
     */

    for (
      let i = 0;
      i < offset;
      i++
    ) {

      const empty =
        document.createElement("div");

      empty.className = "day";

      container.appendChild(empty);

    }


    /*
     * Días del mes
     */

    for (
      let day = 1;
      day <= daysInMonth;
      day++
    ) {

      const cell =
        document.createElement("div");

      cell.className = "day";


      const date =
        new Date(
          year,
          month,
          day
        );


      /*
       * ¿Es hoy?
       */

      const today =
        new Date();


      if (

        date.getFullYear() ===
          today.getFullYear()

        &&

        date.getMonth() ===
          today.getMonth()

        &&

        date.getDate() ===
          today.getDate()

      ) {

        cell.classList.add(
          "today"
        );

      }


      /*
       * Número del día
       */

      const dateElement =
        document.createElement("div");

      dateElement.className =
        "date";

      dateElement.textContent =
        day;

      cell.appendChild(
        dateElement
      );


      /*
       * Eventos de este día
       */

      const dayEvents =
        events.filter(event =>

          event.date.getFullYear() ===
            year

          &&

          event.date.getMonth() ===
            month

          &&

          event.date.getDate() ===
            day

        );


      dayEvents.forEach(event => {

        const eventElement =
          document.createElement("div");

        eventElement.className =
          "event";


        /*
         * Hora
         */

        if (
          event.date.getHours() !== 0 ||
          event.date.getMinutes() !== 0
        ) {

          const timeElement =
            document.createElement("div");

          timeElement.className =
            "event-time";

          timeElement.textContent =
            event.date.toLocaleTimeString(
              "es-MX",
              {
                hour: "2-digit",
                minute: "2-digit"
              }
            );

          eventElement.appendChild(
            timeElement
          );

        }


        /*
         * Título
         */

        const titleElement =
          document.createElement("div");

        titleElement.textContent =
          event.title;

        eventElement.appendChild(
          titleElement
        );


        /*
         * Location como tooltip
         */

        if (event.location) {

          eventElement.title =
            event.location;

        }


        cell.appendChild(
          eventElement
        );

      });


      container.appendChild(
        cell
      );

    }

  }


  /*
   * Mes anterior
   */

  document
    .getElementById("previous")
    .addEventListener(
      "click",
      () => {

        currentDate.setMonth(
          currentDate.getMonth() - 1
        );

        renderCalendar();

      }
    );


  /*
   * Mes siguiente
   */

  document
    .getElementById("next")
    .addEventListener(
      "click",
      () => {

        currentDate.setMonth(
          currentDate.getMonth() + 1
        );

        renderCalendar();

      }
    );


  /*
   * Iniciar
   */

  loadCalendar();

</script>

</body>
</html>
