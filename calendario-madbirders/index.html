<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MADBirders — Calendario</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #f7f7f5;
      color: #222;
    }


    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }


    header {
      margin-bottom: 30px;
    }


    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 600;
    }


    .subtitle {
      margin-top: 6px;
      color: #666;
      font-size: 16px;
    }


    .calendar {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
    }


    /* =========================
       CALENDAR HEADER
       ========================= */

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 18px 20px;

      border-bottom: 1px solid #ddd;
    }


    .month-title {
      font-size: 20px;
      font-weight: 600;
    }


    button {
      border: 1px solid #ccc;
      background: #fff;

      border-radius: 7px;

      padding: 7px 12px;

      cursor: pointer;

      font-size: 14px;
    }


    button:hover {
      background: #f2f2f2;
    }


    /* =========================
       WEEKDAYS
       ========================= */

    .weekdays,
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }


    .weekday {
      padding: 12px 8px;

      text-align: center;

      font-size: 12px;
      font-weight: 600;

      color: #777;

      border-bottom: 1px solid #eee;
    }


    /* =========================
       DAYS
       ========================= */

    .day {
      min-height: 110px;

      padding: 8px;

      border-right: 1px solid #eee;
      border-bottom: 1px solid #eee;

      overflow: hidden;
    }


    .day:nth-child(7n) {
      border-right: none;
    }


    .date {
      font-size: 13px;

      color: #666;

      margin-bottom: 7px;
    }


    /* =========================
       EVENTS
       ========================= */

    .event {
      background: #222;
      color: #fff;

      border-radius: 5px;

      padding: 6px 7px;

      margin-bottom: 4px;

      font-size: 12px;

      line-height: 1.3;

      cursor: default;

      overflow: hidden;
    }


    .event-time {
      opacity: 0.7;

      font-size: 10px;

      margin-bottom: 2px;
    }


    .event-location {
      opacity: 0.7;

      font-size: 10px;

      margin-top: 3px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    /* =========================
       TODAY
       ========================= */

    .today .date {
      font-weight: 700;

      color: #000;
    }


    /* =========================
       LOADING / ERROR
       ========================= */

    .loading,
    .error {
      padding: 40px;

      text-align: center;

      color: #777;

      grid-column: 1 / -1;
    }


    .error {
      color: #a00;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 700px) {

      .container {
        padding: 25px 10px;
      }


      h1 {
        font-size: 26px;
      }


      .subtitle {
        font-size: 14px;
      }


      .calendar-header {
        padding: 14px;
      }


      .month-title {
        font-size: 17px;
      }


      .day {
        min-height: 80px;

        padding: 5px;
      }


      .date {
        font-size: 11px;
      }


      .event {
        font-size: 10px;

        padding: 4px;
      }


      .event-time {
        font-size: 9px;
      }


      .event-location {
        display: none;
      }


      .weekday {
        font-size: 10px;

        padding: 10px 2px;
      }

    }

  </style>
</head>


<body>

<div class="container">


  <!-- =========================
       HEADER
       ========================= -->

  <header>

    <h1>MADBirders</h1>

    <div class="subtitle">
      Calendario de salidas
    </div>

  </header>


  <!-- =========================
       CALENDAR
       ========================= -->

  <div class="calendar">


    <!-- CALENDAR NAVIGATION -->

    <div class="calendar-header">

      <button id="previous">
        ←
      </button>


      <div
        class="month-title"
        id="monthTitle"
      >
        Cargando...
      </div>


      <button id="next">
        →
      </button>

    </div>


    <!-- WEEKDAYS -->

    <div class="weekdays">

      <div class="weekday">
        LUN
      </div>

      <div class="weekday">
        MAR
      </div>

      <div class="weekday">
        MIÉ
      </div>

      <div class="weekday">
        JUE
      </div>

      <div class="weekday">
        VIE
      </div>

      <div class="weekday">
        SÁB
      </div>

      <div class="weekday">
        DOM
      </div>

    </div>


    <!-- DAYS -->

    <div
      id="calendarDays"
      class="days"
    >

      <div class="loading">
        Cargando calendario...
      </div>

    </div>


  </div>


</div>


<script>


/* =========================================================
   GOOGLE APPS SCRIPT
   ========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbw3FijG4k9npjgom8U-yLfMCDVzKF_VnQWkCk8r3i9eDqayroqb5mrsjLgn3t729TY/exec";


/* =========================================================
   VARIABLES
   ========================================================= */

let events = [];

let currentDate = new Date();


/* =========================================================
   LOAD CALENDAR
   ========================================================= */

async function loadCalendar() {

  try {

    const response =
      await fetch(API_URL);


    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );

    }


    const result =
      await response.json();


    console.log(
      "Respuesta API:",
      result
    );


    if (!result.success) {

      throw new Error(
        result.error ||
        "Error obteniendo calendario"
      );

    }


    /*
     * El Apps Script devuelve
     * el contenido completo del .ics
     */

    events =
      parseICS(result.data);


    console.log(
      "Eventos encontrados:",
      events
    );


    renderCalendar();


  } catch (error) {

    console.error(
      "Error:",
      error
    );


    document
      .getElementById("calendarDays")
      .innerHTML =

      '<div class="error">' +

      'No se pudo cargar el calendario.' +

      '<br>' +

      '<small>' +
      error.message +
      '</small>' +

      '</div>';

  }

}


/* =========================================================
   PARSE ICS
   ========================================================= */

function parseICS(data) {

  const parsedEvents = [];


  /*
   * ICS puede dividir propiedades
   * en varias líneas.
   *
   * Unimos las líneas continuadas.
   */

  data =
    data.replace(
      /\r?\n[ \t]/g,
      ""
    );


  /*
   * Separar VEVENT
   */

  const blocks =
    data.split(
      "BEGIN:VEVENT"
    );


  blocks.forEach(block => {


    if (
      !block.includes(
        "END:VEVENT"
      )
    ) {

      return;

    }


    /*
     * Obtener una propiedad
     */

    function getValue(name) {

      const regex =
        new RegExp(
          "^" +
          name +
          "(?:;[^:]*)?:(.*)$",
          "mi"
        );


      const match =
        block.match(regex);


      return match
        ? match[1].trim()
        : "";

    }


    const dtstart =
      getValue("DTSTART");


    const dtend =
      getValue("DTEND");


    const summary =
      getValue("SUMMARY");


    const location =
      getValue("LOCATION");


    /*
     * Sin fecha o título,
     * ignoramos el evento.
     */

    if (
      !dtstart ||
      !summary
    ) {

      return;

    }


    /*
     * Crear evento
     */

    parsedEvents.push({

      date:
        parseICSDate(dtstart),

      end:
        dtend
          ? parseICSDate(dtend)
          : null,

      title:
        cleanICS(summary),

      location:
        cleanICS(location)

    });

  });


  return parsedEvents;

}


/* =========================================================
   PARSE ICS DATE
   ========================================================= */

function parseICSDate(value) {


  /*
   * Evento de día completo
   *
   * Ejemplo:
   *
   * 20260918
   */

  if (
    value.length === 8
  ) {

    const year =
      Number(
        value.substring(0, 4)
      );


    const month =
      Number(
        value.substring(4, 6)
      ) - 1;


    const day =
      Number(
        value.substring(6, 8)
      );


    return new Date(
      year,
      month,
      day
    );

  }


  /*
   * Evento con hora
   *
   * Ejemplo:
   *
   * 20260918T183000
   */

  const clean =
    value.replace(
      /Z$/,
      ""
    );


  const year =
    Number(
      clean.substring(0, 4)
    );


  const month =
    Number(
      clean.substring(4, 6)
    ) - 1;


  const day =
    Number(
      clean.substring(6, 8)
    );


  const hour =
    Number(
      clean.substring(9, 11)
    );


  const minute =
    Number(
      clean.substring(11, 13)
    );


  return new Date(
    year,
    month,
    day,
    hour,
    minute
  );

}


/* =========================================================
   CLEAN ICS TEXT
   ========================================================= */

function cleanICS(value) {

  return value

    .replace(
      /\\n/g,
      " "
    )

    .replace(
      /\\,/g,
      ","
    )

    .replace(
      /\\;/g,
      ";"
    )

    .replace(
      /\\\\/g,
      "\\"
    );

}


/* =========================================================
   CHECK IF EVENT OCCURS ON A DAY
   ========================================================= */

function eventOccursOnDay(
  event,
  dayStart,
  dayEnd
) {


  /*
   * Si tiene DTEND:
   *
   * El final de un evento ICS
   * es EXCLUSIVO.
   *
   * Ejemplo:
   *
   * DTSTART:20260918
   * DTEND:20260921
   *
   * Ocupa:
   *
   * 18
   * 19
   * 20
   *
   * NO ocupa el 21.
   */

  if (event.end) {

    return (
      event.date < dayEnd &&
      event.end > dayStart
    );

  }


  /*
   * Evento sin DTEND.
   */

  return (
    event.date >= dayStart &&
    event.date < dayEnd
  );

}


/* =========================================================
   RENDER CALENDAR
   ========================================================= */

function renderCalendar() {


  const year =
    currentDate.getFullYear();


  const month =
    currentDate.getMonth();


  /*
   * Nombre del mes
   */

  const monthName =
    currentDate.toLocaleDateString(
      "es-MX",
      {
        month: "long",
        year: "numeric"
      }
    );


  document
    .getElementById(
      "monthTitle"
    )
    .textContent =

    monthName
      .charAt(0)
      .toUpperCase() +

    monthName.slice(1);


  /*
   * Contenedor
   */

  const container =
    document.getElementById(
      "calendarDays"
    );


  container.innerHTML = "";


  /*
   * Primer día del mes
   *
   * JavaScript:
   *
   * Domingo = 0
   * Lunes = 1
   *
   * Nuestro calendario:
   *
   * Lunes = primera columna
   */

  const firstDay =
    new Date(
      year,
      month,
      1
    ).getDay();


  const offset =
    firstDay === 0
      ? 6
      : firstDay - 1;


  /*
   * Número de días
   */

  const daysInMonth =
    new Date(
      year,
      month + 1,
      0
    ).getDate();


  /*
   * Celdas vacías
   * antes del día 1
   */

  for (
    let i = 0;
    i < offset;
    i++
  ) {

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "day";


    container.appendChild(
      empty
    );

  }


  /*
   * Crear cada día
   */

  for (
    let day = 1;
    day <= daysInMonth;
    day++
  ) {


    const cell =
      document.createElement(
        "div"
      );


    cell.className =
      "day";


    /*
     * Inicio del día
     */

    const dayStart =
      new Date(
        year,
        month,
        day,
        0,
        0,
        0,
        0
      );


    /*
     * Final del día
     */

    const dayEnd =
      new Date(
        year,
        month,
        day + 1,
        0,
        0,
        0,
        0
      );


    /*
     * =========================
     * ¿ES HOY?
     * =========================
     */

    const today =
      new Date();


    if (

      dayStart.getFullYear() ===
        today.getFullYear()

      &&

      dayStart.getMonth() ===
        today.getMonth()

      &&

      dayStart.getDate() ===
        today.getDate()

    ) {

      cell.classList.add(
        "today"
      );

    }


    /*
     * Número del día
     */

    const dateElement =
      document.createElement(
        "div"
      );


    dateElement.className =
      "date";


    dateElement.textContent =
      day;


    cell.appendChild(
      dateElement
    );


    /*
     * =========================
     * EVENTOS DEL DÍA
     * =========================
     */

    const dayEvents =
      events.filter(
        event =>
          eventOccursOnDay(
            event,
            dayStart,
            dayEnd
          )
      );


    /*
     * Dibujar eventos
     */

    dayEvents.forEach(
      event => {


        const eventElement =
          document.createElement(
            "div"
          );


        eventElement.className =
          "event";


        /*
         * =========================
         * HORA
         * =========================
         *
         * Solo mostramos la hora
         * si realmente existe.
         */

        const hasTime =
          event.date.getHours() !== 0 ||
          event.date.getMinutes() !== 0;


        if (hasTime) {


          const timeElement =
            document.createElement(
              "div"
            );


          timeElement.className =
            "event-time";


          timeElement.textContent =
            event.date.toLocaleTimeString(
              "es-MX",
              {
                hour: "2-digit",
                minute: "2-digit"
              }
            );


          eventElement.appendChild(
            timeElement
          );

        }


        /*
         * =========================
         * TÍTULO
         * =========================
         */

        const titleElement =
          document.createElement(
            "div"
          );


        titleElement.textContent =
          event.title;


        eventElement.appendChild(
          titleElement
        );


        /*
         * =========================
         * UBICACIÓN
         * =========================
         */

        if (
          event.location
        ) {


          const locationElement =
            document.createElement(
              "div"
            );


          locationElement.className =
            "event-location";


          locationElement.textContent =
            event.location;


          eventElement.appendChild(
            locationElement
          );


          /*
           * También mostramos
           * la ubicación al pasar
           * el mouse.
           */

          eventElement.title =
            event.location;

        }


        /*
         * Añadir evento
         * al día
         */

        cell.appendChild(
          eventElement
        );

      }
    );


    /*
     * Añadir día
     * al calendario
     */

    container.appendChild(
      cell
    );

  }

}


/* =========================================================
   PREVIOUS MONTH
   ========================================================= */

document
  .getElementById(
    "previous"
  )
  .addEventListener(
    "click",
    () => {


      currentDate.setMonth(
        currentDate.getMonth() - 1
      );


      renderCalendar();

    }
  );


/* =========================================================
   NEXT MONTH
   ========================================================= */

document
  .getElementById(
    "next"
  )
  .addEventListener(
    "click",
    () => {


      currentDate.setMonth(
        currentDate.getMonth() + 1
      );


      renderCalendar();

    }
  );


/* =========================================================
   START
   ========================================================= */

loadCalendar();

</script>

</body>
</html>
