<style>

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      Arial,
      sans-serif;

    background: #111111;
    color: #f5f5f5;
  }


  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 20px;
  }


  /* =========================
     HEADER
     ========================= */

  header {
    margin-bottom: 30px;
  }


  h1 {
    margin: 0;

    font-size: 32px;

    font-weight: 600;

    color: #f5f5f5;
  }


  .subtitle {
    margin-top: 6px;

    color: #999;

    font-size: 16px;
  }


  /* =========================
     CALENDAR
     ========================= */

  .calendar {
    background: #1a1a1a;

    border: 1px solid #303030;

    border-radius: 12px;

    overflow: hidden;
  }


  /* =========================
     CALENDAR HEADER
     ========================= */

  .calendar-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 18px 20px;

    border-bottom: 1px solid #303030;
  }


  .month-title {
    font-size: 20px;

    font-weight: 600;

    color: #f5f5f5;
  }


  button {
    border: 1px solid #444;

    background: #222;

    color: #f5f5f5;

    border-radius: 7px;

    padding: 7px 12px;

    cursor: pointer;

    font-size: 14px;

    transition:
      background 0.15s ease,
      border-color 0.15s ease;
  }


  button:hover {
    background: #2c2c2c;

    border-color: #555;
  }


  /* =========================
     WEEKDAYS
     ========================= */

  .weekdays,
  .days {
    display: grid;

    grid-template-columns:
      repeat(7, 1fr);
  }


  .weekday {
    padding: 12px 8px;

    text-align: center;

    font-size: 12px;

    font-weight: 600;

    color: #888;

    border-bottom: 1px solid #303030;
  }


  /* =========================
     DAYS
     ========================= */

  .day {
    min-height: 110px;

    padding: 8px;

    background: #1a1a1a;

    border-right: 1px solid #303030;

    border-bottom: 1px solid #303030;

    overflow: hidden;
  }


  .day:nth-child(7n) {
    border-right: none;
  }


  .date {
    font-size: 13px;

    color: #888;

    margin-bottom: 7px;
  }


  /* =========================
     TODAY
     ========================= */

  .today {
    background: #202020;
  }


  .today .date {
    font-weight: 700;

    color: #fff;
  }


  /* =========================
     EVENTS
     ========================= */

  .event {
    background: #e5e5e5;

    color: #111;

    border-radius: 5px;

    padding: 6px 7px;

    margin-bottom: 4px;

    font-size: 12px;

    line-height: 1.3;

    cursor: default;

    overflow: hidden;
  }


  .event-time {
    color: #555;

    font-size: 10px;

    margin-bottom: 2px;
  }


  .event-location {
    color: #666;

    font-size: 10px;

    margin-top: 3px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
  }


  /* =========================
     LOADING / ERROR
     ========================= */

  .loading,
  .error {
    padding: 40px;

    text-align: center;

    color: #888;

    grid-column: 1 / -1;
  }


  .error {
    color: #ff6b6b;
  }


  /* =========================
     MOBILE
     ========================= */

  @media (max-width: 700px) {

    .container {
      padding: 25px 10px;
    }


    h1 {
      font-size: 26px;
    }


    .subtitle {
      font-size: 14px;
    }


    .calendar-header {
      padding: 14px;
    }


    .month-title {
      font-size: 17px;
    }


    .day {
      min-height: 80px;

      padding: 5px;
    }


    .date {
      font-size: 11px;
    }


    .event {
      font-size: 10px;

      padding: 4px;
    }


    .event-time {
      font-size: 9px;
    }


    .event-location {
      display: none;
    }


    .weekday {
      font-size: 10px;

      padding: 10px 2px;
    }

  }

</style>
